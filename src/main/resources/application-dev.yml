server:
  port: 8001
# mysql
spring:
  # 达梦8数据源
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://localhost:5236?compatibleMode=oracle&useUnicode=true&characterEncoding=utf8
    username: SYSDBA
    password: 20041006Song
  servlet:
    multipart:
      # 单个文件最大 50MB
      max-file-size: 50MB
      # 整个请求表单总大小 50MB
      max-request-size: 50MB
  mvc:
    pathmatch:
      # 配置策略 如sping版本高于2.4以上则需要添加，否则会导致swagger文档不适配
      matching-strategy: ant-path-matcher


# mybaentitytis-plus
mybatis-plus:
  mapper-location: classpath*:/mapper/*.xml
  type-aliases-package: com.jc.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# Swagger3 配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 日志
logging:
  level:
    org.flowable: info
    com.baomidou: info