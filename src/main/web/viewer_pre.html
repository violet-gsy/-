    // ========================= 消息分发 =========================
    function handleSimEvent(msg) {
        const statusEl = document.getElementById('simStatus');
        switch (msg.event) {

            case 'backend_error':
                appendEventLog(msg.message || '后端发生错误', 'error', msg.time);
                showNotification('❌ ' + (msg.message || '后端错误'), true);
            { const ld = document.getElementById('loadingMsg'); if (ld && ld.style.display !== 'none') ld.innerHTML = `<div style="color:#D32F2F">❌ ${escapeHtml(msg.message || '')}</div>`; }
                break;

            case 'backend_info':
                appendEventLog(msg.message || '后端提示', 'info', msg.time);
                showNotification('ℹ️ ' + (msg.message || ''));
                break;

            case 'log':
                appendEventLog(msg.message || '', msg.level || 'info', msg.time);
                break;

            case 'status':
                if (msg.status === 'ready') showNotification('✅ MagicDraw 后端已就绪');
                break;

            case 'diagram_json':
                applyDiagramData(msg.data, msg.name);
                break;

            case 'sim_start':
                clearAllActiveStates();
                statusEl.className = 'sim-status running';
                statusEl.textContent = '▶ 仿真运行中';
                showNotification('▶ MagicDraw 仿真已开始');
                startRecording(msg);
                break;

            case 'sim_end':
                // ★ 关键修复：立即强制完成所有正在执行的节点
                if (isRecording && currentRunId) {
                    activeNodes.forEach(nodeId => {
                        if (deactivateTimers.has(nodeId)) {
                            clearTimeout(deactivateTimers.get(nodeId));
                            deactivateTimers.delete(nodeId);
                        }
                        recordNodeFinish(currentRunId, nodeId);
                    });
                    activeNodes.clear();

                    // 同时清理所有粒子动画
                    particleHandles.forEach(h => h.cancel());
                    particleHandles.clear();
                }

                if (wsReady()) {
                    ws.send(JSON.stringify({ command: 'get_all_node_stats' }));
                    setTimeout(() => {
                        statusEl.className = 'sim-status ended';
                        statusEl.textContent = '⏹ 仿真已结束';
                        showNotification('⏹ 仿真结束');
                        stopRecording();
                    }, 500);
                }
                break;
            case 'node_activate':
                activateNode(msg.nodeId);
                break;

            case 'node_deactivate':
                deactivateNode(msg.nodeId);
                break;

            case 'clear_all':
                clearAllActiveStates();
                break;

            case 'runtime_values':
                saveVariable(msg.values || {});
                break;

            case 'replay_data':
                startReplay(msg.record);
                break;

            case 'replay_saved': {
                const info = document.getElementById('replayInfo');
                if (info) info.innerHTML = `已保存最近一次回放：<span class="replay-badge">${escapeHtml(msg.runId || '')}</span>`;
                appendEventLog('回放记录已保存：' + (msg.runId || ''), 'info', msg.time);
                break;
            }

            case 'external_interaction_request':
                appendEventLog('⚡ 外部交互请求: ' + (msg.nodeName || ''), 'warn', msg.time);
                showNotification('⚡ 需要外部输入: ' + (msg.nodeName || ''));
                renderExternalInteractionForm(msg);
                break;

            // ========== 节点统计信息 ==========
            case 'node_stats':
                if (msg.nodeName) {
                    nodeStatsCache[msg.nodeName] = {
                        requiredPeople: msg.requiredPeople,
                        duration: msg.duration,
                        readyTime: msg.readyTime,
                        startTime: msg.startTime,
                        finishTime: msg.finishTime,
                        waitTime: msg.waitTime,
                        totalTime: msg.totalTime,
                        status: msg.status,
                        queuePosition: msg.queuePosition,
                        queueSize: msg.queueSize
                    };

                    // ★ 新增：根据状态记录到数据库
                    if (isRecording && currentRunId) {
                        const node = currentData?.nodes?.find(n => n.name === msg.nodeName);
                        if (node) {
                            if (msg.status === 'ready') {
                                // 使用消息中的 requiredPeople（这里有真实值）
                                recordNodeReady(
                                    currentRunId,
                                    node.id,
                                    node.name || '',
                                    node.type || '',
                                    msg.requiredPeople || 0,  // ← 使用消息中的值
                                    node.isStartNode || false,
                                    node.isEndNode || false,
                                    node.description || ''
                                );
                            } else if (msg.status === 'waiting') {
                                recordNodeWaiting(currentRunId, node.id, msg.queuePosition, msg.queueSize);
                            } else if (msg.status === 'error') {
                                recordNodeError(currentRunId, node.id, msg.errorMessage || '执行错误');
                            }
                        }
                    }

                    // 如果该节点当前被选中，刷新面板
                    if (currentData) {
                        const selectedNode = currentData.nodes.find(n => n.id === selectedNodeId);
                        if (selectedNode && selectedNode.name === msg.nodeName) {
                            const nodeIsActive = msg.status === 'running';
                            showNodePanel(selectedNode, nodeIsActive);
                        }
                    }
                }
                break;

            // ========== 资源池状态 ==========
            case 'resource_pool_status':
                appendEventLog(
                    `📊 资源池：总数=${msg.total}，可用=${msg.available}，等待队列=${msg.waitingQueueSize}`,
                    'info',
                    ''
                );
                break;

            case 'init_body_data':
                renderInitBodyEditor(msg.nodeId, msg.bodies || []);
                break;

            case 'init_body_updated':
                handleInitBodyUpdateResult(msg);
                break;

            // ========== 资源管理日志 ==========
            case 'resource_log':
                appendEventLog(msg.message || '', msg.level || 'info', msg.time);
                break;

            // ========== 节点配置相关 ==========
            case 'node_config':
                console.log('📥 [node_config] 收到配置:', msg);

                // ★ 1. 更新缓存
                if (msg.config && msg.taskName) {
                    if (typeof nodeConfigCache !== 'undefined') {
                        nodeConfigCache.set(msg.taskName, msg.config);
                        console.log(`✅ 缓存已更新: ${msg.taskName}, requiredPeople=${msg.config.requiredPeople}`);
                    }
                }

                // ★ 2. 检查是否有等待的回调（用于配置加载）
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    console.log(`✅ 找到回调 ${msg._callbackId}，执行中...`);
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg.config);
                } else {
                    console.log('ℹ️ 没有对应的回调，作为普通配置查询处理');
                    // 普通查询：更新UI
                    handleNodeConfigResponse(msg);
                }
                break;

            // 在 handleSimEvent 中，将 node_config_updated 的处理改为：
            case 'node_config_updated':
                console.log('📥 [node_config_updated] 收到配置更新结果:', msg);
                // ★ 检查是否有 callbackId
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    console.log('✅ 通过 callbackId 处理更新响应');
                    const callback = window._configCallbacks[msg._callbackId];
                    callback(msg);
                } else {
                    // 降级处理
                    handleNodeConfigResponse(msg);
                }
                break;

            // 在 handleSimEvent 的 switch 中添加
            case 'debug_stereotype_info':
                appendEventLog(
                    `🔍 节点 "${msg.taskName}" 的 Stereotype 属性: ` +
                    `hasStereotype=${msg.hasStereotype}, ` +
                    `requiredPeople=${msg.requiredPeople}, ` +
                    `duration=${msg.duration}, ` +
                    `elementType=${msg.elementType}`,
                    'info'
                );
                showNotification(`🔍 节点 "${msg.taskName}" requiredPeople=${msg.requiredPeople}, duration=${msg.duration}`);
                break;

            default:
                console.log('未处理的后端事件：', msg);
                break;
        }
    }


    function renderInitBodyEditor(nodeId, bodies) {
        // 找到当前面板，追加一个 section
        const panel = document.getElementById('panelContent');
        if (!panel) return;

        // 移除旧的 body-editor（避免重复）
        const old = panel.querySelector('#initBodySection');
        if (old) old.remove();

        if (!bodies || bodies.length === 0) return;

        const firstBody = bodies[0];
        const lang = firstBody.language || 'English';
        const body = firstBody.body || '';

        // 解析 initResourcePool 参数（可选高亮）
        const parsed = parseInitResourcePoolArgs(body);

        const section = document.createElement('div');
        section.id = 'initBodySection';
        section.className = 'info-section';
        section.innerHTML = `

        ${parsed ? `
        <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px;">
            <div style="font-weight:600;color:#0369a1;margin-bottom:4px;">📊 解析到的参数</div>
            <div style="display:flex;gap:16px;flex-wrap:wrap;">
                <span>操作人员总数：<b style="color:#0284c7">${parsed.total}</b></span>
                <span>时间缩放(ms)：<b style="color:#0284c7">${parsed.scale}</b></span>
            </div>
        </div>` : ''}

        <div style="margin-bottom:6px;">
            <label style="font-size:11px;font-weight:600;color:#475569;display:block;margin-bottom:4px;">Body 内容（可直接编辑）</label>
            <textarea id="initBodyTextarea" rows="4"
                style="width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:4px;
                       font-size:12px;font-family:Consolas,monospace;resize:vertical;
                       background:white;box-sizing:border-box;"
            >${escapeHtml(body)}</textarea>
        </div>

        ${parsed ? `
        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin-bottom:8px;">
            <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">⚡ 快速调参</div>
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;">
                <label style="width:80px;color:#475569;flex-shrink:0;">操作人员</label>
                <input id="quickTotal" type="number" min="0" step="1" value="${parsed.total}"
                    style="width:80px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;"
                    oninput="syncInitBodyFromQuick('${escapeHtml(nodeId)}')">
            </div>
            <div style="display:flex;gap:8px;align-items:center;font-size:12px;">
                <label style="width:80px;color:#475569;flex-shrink:0;">时间缩放</label>
                <input id="quickScale" type="number" min="0" step="1" value="${parsed.scale}"
                    style="width:80px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;"
                    oninput="syncInitBodyFromQuick('${escapeHtml(nodeId)}')">
            </div>
        </div>` : ''}

        <button onclick="submitInitBody('${escapeHtml(nodeId)}')"
            style="width:100%;padding:7px;background:#3b82f6;color:white;border:none;
                   border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:4px;">
            💾 写回 MagicDraw
        </button>

    `;

        panel.appendChild(section);
    }

    /** 从快速调参同步到 textarea */
    function syncInitBodyFromQuick(nodeId) {
        const ta   = document.getElementById('initBodyTextarea');
        const total = document.getElementById('quickTotal')?.value;
        const scale = document.getElementById('quickScale')?.value;
        if (!ta || total === undefined || scale === undefined) return;

        // 替换 initResourcePool 的第2、3参数
        ta.value = ta.value.replace(
            /(Packages\.myplugin\.OperatorResourceManager\.initResourcePool\s*\(\s*ALH\s*,\s*)[\d.]+(\s*,\s*)[\d.]+/,
            `$1${total}$2${scale}`
        );
    }

    /** 提交 Body 到后端 */
    function submitInitBody(nodeId) {
        if (!wsReady()) { showNotification('❌ 未连接，无法提交', true); return; }
        const ta = document.getElementById('initBodyTextarea');
        if (!ta) return;
        const statusDiv = document.getElementById('initBodyStatus');
        if (statusDiv) { statusDiv.style.color = '#3b82f6'; statusDiv.textContent = '⏳ 提交中...'; }

        ws.send(JSON.stringify({
            command: 'update_init_node_body',
            nodeId,
            body: ta.value
        }));
    }

    /** 处理写回结果 */
    function handleInitBodyUpdateResult(msg) {
        const statusDiv = document.getElementById('initBodyStatus');
        if (!statusDiv) return;
        if (msg.success) {
            statusDiv.style.color = '#16a34a';
            statusDiv.textContent = '✅ 已写回 MagicDraw';
            showNotification('✅ 初始化 Body 已更新');
        } else {
            statusDiv.style.color = '#dc2626';
            statusDiv.textContent = '❌ ' + (msg.error || '未知错误');
            showNotification('❌ 写回失败: ' + (msg.error || ''), true);
        }
    }

    /** 解析 initResourcePool(ALH, 35, 100) 中的参数 */
    function parseInitResourcePoolArgs(body) {
        const m = body.match(/initResourcePool\s*\(\s*ALH\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
        if (!m) return null;
        return { total: m[1], scale: m[2] };
    }

    // ========================= 图数据应用 =========================
    function applyDiagramData(data, name) {
        currentData = data;
        if (!currentData || !currentData.nodes || currentData.nodes.length === 0) {
            showNotification('❌ 图中没有可渲染节点', true);
            const ld = document.getElementById('loadingMsg');
            if (ld) ld.innerHTML = `<div style="color:#D32F2F">❌ 图中没有可渲染节点</div>`;
            return;
        }
        currentData.nodes = currentData.nodes.filter(n => n.type !== 'DiagramImpl');
        if (name) document.getElementById('diagramTitle').innerHTML = '📋 ' + escapeHtml(name);
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('diagramSvg').style.display = 'block';
        initSVG(); renderDiagram();
        setTimeout(fitView, 100);
        showNotification('✅ 已从 MagicDraw 加载图');
    }

    // ========================= 视图控制 =========================
    function zoomIn()    { d3.select('#diagramSvg').transition().duration(200).call(zoomBehavior.scaleBy, 1.2); }
    function zoomOut()   { d3.select('#diagramSvg').transition().duration(200).call(zoomBehavior.scaleBy, .85); }
    function resetView() { d3.select('#diagramSvg').transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity); }
    function fitView() {
        const b = calculateBounds(), svgEl = document.getElementById('diagramSvg');
        const w = svgEl.clientWidth || 800, h = svgEl.clientHeight || 600;
        const sc = Math.min(w / b.width, h / b.height) * .88;
        const tx = (w - b.width * sc) / 2 - b.minX * sc;
        const ty = (h - b.height * sc) / 2 - b.minY * sc;
        d3.select('#diagramSvg').transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));
    }
    function goBack() { ws?.close(); location.href = 'index.html'; }

    // 点击空白处取消选中
    document.getElementById('diagramSvg').addEventListener('click', ev => {
        if (ev.target === ev.currentTarget || ev.target.tagName === 'svg') {
            clearSelection();
            document.getElementById('panelContent').innerHTML = '<div class="empty-state">✨ 点击节点或连线，查看仿真详情</div>';
            currentNodeConfig = null;
            currentConfigTaskName = null;
        }
    });

    // ========================= 启动 =========================

    // ========================= 指标树绑定功能 =========================
    const indicatorTreeData = [
        {
            id: 'root',
            name: '关联指标',
            children: [
                {
                    id: 'comprehensive',
                    name: '综合指标',
                    children: [
                        { id: 'time_index', name: '时间指标' },
                        { id: 'manpower_index', name: '人力指标' }
                    ]
                },
                { id: 'install_time', name: '装备安装时间' },
                { id: 'pipe_check_time', name: '管路检测时间' },
                { id: 'subsystem_test_time', name: '分系统测试时间' },
                { id: 'install_manpower', name: '装备安装人力' },
                { id: 'pipe_check_manpower', name: '管路检测人力' },
                { id: 'subsystem_test_manpower', name: '分系统测试人力' },
                { id: 'filling_time', name: '加注时间' },
                { id: 'transfer_time', name: '转场时间' },
                { id: 'filling_manpower', name: '加注人力' },
                { id: 'transfer_manpower', name: '转场人力' }
            ]
        }
    ];

    let selectedIndicators = new Set();
    let expandedNodes = new Set(['root', 'comprehensive']);
    let indicatorSearchKeyword = '';

    function toggleIndicatorPanel() {
        const panel = document.getElementById('indicatorPanel');
        const btn = document.getElementById('backBtn');
        panel.classList.toggle('collapsed');
        const collapsed = panel.classList.contains('collapsed');
        if (btn) btn.style.left = collapsed ? '24px' : '284px';
        const toggleBtn = panel.querySelector('.indicator-toggle');
        if (toggleBtn) toggleBtn.textContent = collapsed ? '▶' : '◀';
    }

    function renderIndicatorTree(data, container, level, parentPath) {
        if (!container) return;
        if (level === undefined) level = 0;
        if (parentPath === undefined) parentPath = [];

        container.innerHTML = '';
        data.forEach(node => {
            renderIndicatorNode(node, container, level, parentPath);
        });
        updateIndicatorBadge();
    }

    function renderIndicatorNode(node, container, level, parentPath) {
        const hasChildren = node.children && node.children.length > 0;
        const isExpanded = expandedNodes.has(node.id);
        const isSelected = selectedIndicators.has(node.id);
        const currentPath = [...parentPath, node];

        // 搜索过滤：如果有关键词，只显示匹配节点及其路径
        if (indicatorSearchKeyword) {
            const keyword = indicatorSearchKeyword.toLowerCase();
            const matchSelf = node.name.toLowerCase().includes(keyword);
            const matchChild = hasChildren && treeNodeHasMatch(node, keyword);
            if (!matchSelf && !matchChild) return; // 跳过不匹配的叶子或无关分支
        }

        const nodeEl = document.createElement('div');
        nodeEl.className = 'tree-node';
        nodeEl.dataset.id = node.id;

        const contentEl = document.createElement('div');
        contentEl.className = 'tree-node-content';
        if (indicatorSearchKeyword && node.name.toLowerCase().includes(indicatorSearchKeyword.toLowerCase())) {
            contentEl.classList.add('matched');
        }
        contentEl.style.paddingLeft = (12 + level * 16) + 'px';

        // 展开/折叠按钮
        const toggleEl = document.createElement('span');
        toggleEl.className = 'tree-toggle' + (hasChildren ? '' : ' leaf') + (isExpanded ? '' : ' collapsed');
        toggleEl.innerHTML = '▼';
        toggleEl.onclick = (e) => {
            e.stopPropagation();
            if (!hasChildren) return;
            if (expandedNodes.has(node.id)) {
                expandedNodes.delete(node.id);
            } else {
                expandedNodes.add(node.id);
            }
            refreshIndicatorTree();
        };

        // 复选框
        const checkboxEl = document.createElement('input');
        checkboxEl.type = 'checkbox';
        checkboxEl.className = 'tree-checkbox';
        checkboxEl.checked = isSelected;
        checkboxEl.indeterminate = getIndeterminateState(node);
        checkboxEl.onclick = (e) => {
            e.stopPropagation();
            toggleIndicatorNode(node, checkboxEl.checked);
        };

        // 标签
        const labelEl = document.createElement('span');
        labelEl.className = 'tree-label';
        labelEl.textContent = node.name;
        labelEl.title = node.name;
        labelEl.onclick = () => {
            if (hasChildren) {
                if (expandedNodes.has(node.id)) {
                    expandedNodes.delete(node.id);
                } else {
                    expandedNodes.add(node.id);
                }
                refreshIndicatorTree();
            }
        };

        contentEl.appendChild(toggleEl);
        contentEl.appendChild(checkboxEl);
        contentEl.appendChild(labelEl);
        nodeEl.appendChild(contentEl);

        // 子节点
        if (hasChildren) {
            const childrenEl = document.createElement('div');
            childrenEl.className = 'tree-children' + (isExpanded ? '' : ' collapsed');
            node.children.forEach(child => {
                renderIndicatorNode(child, childrenEl, level + 1, currentPath);
            });
            nodeEl.appendChild(childrenEl);
        }

        container.appendChild(nodeEl);
    }

    function treeNodeHasMatch(node, keyword) {
        if (node.name.toLowerCase().includes(keyword)) return true;
        if (node.children) {
            for (const child of node.children) {
                if (treeNodeHasMatch(child, keyword)) return true;
            }
        }
        return false;
    }

    function getIndeterminateState(node) {
        if (!node.children || node.children.length === 0) return false;
        const childIds = getAllDescendantIds(node);
        const selectedCount = childIds.filter(id => selectedIndicators.has(id)).length;
        if (selectedCount === 0) return false;
        if (selectedCount === childIds.length) return false; // 全选时由checked体现
        return true;
    }

    function getAllDescendantIds(node) {
        let ids = [];
        if (node.children) {
            node.children.forEach(child => {
                ids.push(child.id);
                ids = ids.concat(getAllDescendantIds(child));
            });
        }
        return ids;
    }

    function getAllDescendants(node) {
        let nodes = [];
        if (node.children) {
            node.children.forEach(child => {
                nodes.push(child);
                nodes = nodes.concat(getAllDescendants(child));
            });
        }
        return nodes;
    }

    function toggleIndicatorNode(node, checked) {
        if (checked) {
            selectedIndicators.add(node.id);
        } else {
            selectedIndicators.delete(node.id);
        }
        // 同步子孙节点
        const descendants = getAllDescendants(node);
        descendants.forEach(d => {
            if (checked) selectedIndicators.add(d.id);
            else selectedIndicators.delete(d.id);
        });
        // 同步祖先节点状态
        syncAncestorStates();
        refreshIndicatorTree();
    }

    function syncAncestorStates() {
        // 简单处理：遍历所有非叶子节点，如果子孙全选则选中，否则不选
        // 由于数据量小，直接全量刷新即可，视觉状态由render时重新计算
    }

    function refreshIndicatorTree() {
        const container = document.getElementById('indicatorTree');
        renderIndicatorTree(indicatorTreeData, container);
    }

    function searchIndicators(keyword) {
        indicatorSearchKeyword = keyword.trim();
        if (indicatorSearchKeyword) {
            // 搜索时自动展开所有包含匹配项的父节点
            expandForSearch(indicatorTreeData, indicatorSearchKeyword.toLowerCase());
        }
        refreshIndicatorTree();
    }

    function expandForSearch(nodes, keyword) {
        nodes.forEach(node => {
            if (node.children) {
                const childMatch = treeNodeHasMatch(node, keyword);
                if (childMatch) {
                    expandedNodes.add(node.id);
                }
                expandForSearch(node.children, keyword);
            }
        });
    }

    function updateIndicatorBadge() {
        const header = document.querySelector('.indicator-header h3');
        if (!header) return;
        const count = selectedIndicators.size;
        let badge = header.querySelector('.indicator-badge');
        if (!badge) {
            badge = document.createElement('span');
            badge.className = 'indicator-badge';
            header.appendChild(badge);
        }
        badge.textContent = count;
        badge.style.display = count > 0 ? 'inline-block' : 'none';
    }

    function getSelectedIndicators() {
        // 返回选中的叶子节点（真正可绑定的指标）
        const result = [];
        const collect = (nodes) => {
            nodes.forEach(node => {
                if (selectedIndicators.has(node.id)) {
                    // 如果是叶子节点或希望返回所有选中节点
                    result.push({ id: node.id, name: node.name });
                }
                if (node.children) collect(node.children);
            });
        };
        collect(indicatorTreeData);
        return result;
    }

    function confirmIndicatorBind() {
        const selected = getSelectedIndicators();
        if (selected.length === 0) {
            showNotification('⚠️ 请至少选择一个指标', true);
            return;
        }
        // 如果有当前选中的节点，可以执行绑定逻辑
        if (selectedNodeId && currentData) {
            const node = currentData.nodes.find(n => n.id === selectedNodeId);
            if (node) {
                appendEventLog(`📌 绑定指标到节点 "${node.name || node.id}": ${selected.map(s => s.name).join(', ')}`, 'info');
                showNotification(`✅ 已绑定 ${selected.length} 个指标到当前节点`);
                // TODO: 发送到后端保存绑定关系
                // ws.send(JSON.stringify({ command: 'bind_indicators', nodeId: selectedNodeId, indicators: selected }));
                return;
            }
        }
        // 未选中节点时，仅展示列表
        appendEventLog(`📌 已选指标: ${selected.map(s => s.name).join(', ')}`, 'info');
        showNotification(`✅ 已选择 ${selected.length} 个指标（未绑定到具体节点）`);
    }

    function clearIndicatorSelection() {
        selectedIndicators.clear();
        refreshIndicatorTree();
        showNotification('🗑 已清空指标选择');
    }

    // 初始化指标树
    refreshIndicatorTree();

    loadJSON();
</script>
