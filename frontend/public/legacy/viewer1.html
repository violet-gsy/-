    // ========================= 回放 =========================
    function requestLatestReplay() {
        if (!wsReady()) { showNotification('❌ 未连接服务器，无法获取回放', true); return; }
        ws.send(JSON.stringify({ command: 'get_latest_replay' }));
        showNotification('🎞 正在读取最近一次仿真回放');
    }

    function startReplay(record) {
        if (!record || !Array.isArray(record.events)) {
            showNotification('❌ 回放数据格式不正确', true); return;
        }
        if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }

        replayEvents = record.events.slice().sort((a, b) => (a.time || 0) - (b.time || 0));
        replayIndex = 0;
        replayStartTime = Date.now();
        replaySpeed = simSpeed || 1.0;

        const info = document.getElementById('replayInfo');
        if (info) {
            info.innerHTML = `当前回放：<span class="replay-badge">${escapeHtml(record.runId || 'latest')}</span><br>
                图：${escapeHtml(record.diagramName || '未知')}<br>
                启动方式：${escapeHtml(record.startMode || '未知')}`;
        }

        if (record.diagramSnapshot && record.diagramSnapshot.nodes) {
            currentData = record.diagramSnapshot;
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('diagramSvg').style.display = 'block';
            initSVG(); renderDiagram(); setTimeout(fitView, 100);
        }

        clearAllActiveStates();
        updateRuntimeValues({});
        appendEventLog('开始回放：' + (record.runId || 'latest'), 'info');
        const statusEl = document.getElementById('simStatus');
        if (statusEl) { statusEl.className = 'sim-status running'; statusEl.textContent = '🎞 回放中'; }

        replayTimer = setInterval(tickReplay, 30);
    }

    function tickReplay() {
        if (replayIndex >= replayEvents.length) {
            clearInterval(replayTimer); replayTimer = null;
            appendEventLog('回放结束', 'info');
            const statusEl = document.getElementById('simStatus');
            if (statusEl) { statusEl.className = 'sim-status ended'; statusEl.textContent = '⏹ 回放结束'; }
            return;
        }
        const elapsed = (Date.now() - replayStartTime) * replaySpeed;
        while (replayIndex < replayEvents.length && (replayEvents[replayIndex].time || 0) <= elapsed) {
            applyReplayEvent(replayEvents[replayIndex++]);
        }
    }

    function applyReplayEvent(e) {
        if (!e || !e.event) return;
        switch (e.event) {
            case 'sim_start':       clearAllActiveStates(); appendEventLog('回放：仿真开始', 'info'); break;
            case 'node_activate':   activateNode(e.nodeId); break;
            case 'node_deactivate': deactivateNode(e.nodeId); break;
            case 'runtime_values':  updateRuntimeValues(e.values || {}); break;
            case 'log':             appendEventLog(e.message || '', e.level || 'info', e.timeText || ''); break;
            case 'sim_end':         appendEventLog('回放：仿真结束 ' + (e.status || ''), 'info'); break;
        }
    }

    // ========================= WebSocket =========================
    function toggleConnection() { isConnected ? disconnectWS() : connectWS(); }

    function connectWS() {
        if (ws && ws.readyState === WebSocket.OPEN) return;
        const statusEl = document.getElementById('simStatus');
        statusEl.className = 'sim-status'; statusEl.textContent = '⏳ 连接中...';
        ws = new WebSocket('ws://127.0.0.1:8765');

        ws.onopen = () => {
            isConnected = true;
            statusEl.className = 'sim-status connected';
            statusEl.textContent = '🟢 已连接 MagicDraw';
            document.getElementById('connectBtn').textContent = '🔌 断开';
            updateControlButtons(true);
            showNotification('✅ WebSocket 已就绪，可控制仿真');
            sendSpeedToBackend();
            const diagramId = getUrlParam('diagramId');
            if (diagramId && !diagramRequested) {
                diagramRequested = true;
                ws.send(JSON.stringify({ command: 'get_diagram_json', diagramId }));
            }
        };

        ws.onclose = () => {
            isConnected = false; ws = null;
            statusEl.className = 'sim-status'; statusEl.textContent = '⚪ 未连接';
            document.getElementById('connectBtn').textContent = '🔌 连接';
            updateControlButtons(false);
            if (isRecording) {
                stopRecording();
            }
        };

        ws.onerror = () => {
            statusEl.className = 'sim-status'; statusEl.textContent = '⚠️ 连接失败';
            showNotification('❌ 无法连接至 MagicDraw 插件，请确认插件已运行', true);
        };

        ws.onmessage = evt => {
            try { handleSimEvent(JSON.parse(evt.data)); }
            catch (e) { console.warn('非JSON消息', evt.data); }
        };
    }

    function disconnectWS() { ws?.close(); ws = null; }

    function updateControlButtons(on) {
        ['startSimBtn', 'startContextBtn', 'startConfigBtn', 'stopSimBtn', 'replayBtn'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.disabled = !on;
        });
    }

    // ========================= 消息处理 =========================
    function handleSimEvent(msg) {
        const statusEl = document.getElementById('simStatus');

        switch (msg.event) {
            case 'backend_error':
                appendEventLog(msg.message || '后端发生错误', 'error', msg.time);
                showNotification('❌ ' + (msg.message || '后端错误'), true);
                break;

            case 'backend_info':
                appendEventLog(msg.message || '后端提示', 'info', msg.time);
                showNotification('ℹ️ ' + (msg.message || ''));
                break;

            case 'log':
                appendEventLog(msg.message || '', msg.level || 'info', msg.time);
                break;

            case 'status':
                if (msg.status === 'ready') showNotification('✅ MagicDraw 后端已就绪');
                break;

            case 'diagram_json':
                applyDiagramData(msg.data, msg.name);
                break;

            case 'sim_start':
                clearAllActiveStates();
                statusEl.className = 'sim-status running';
                statusEl.textContent = '▶ 仿真运行中';
                showNotification('▶ MagicDraw 仿真已开始');
                startRecording(msg);
                break;

            case 'sim_end':
                if (isRecording && currentRunId) {
                    activeNodes.forEach(nodeId => {
                        if (deactivateTimers.has(nodeId)) {
                            clearTimeout(deactivateTimers.get(nodeId));
                            deactivateTimers.delete(nodeId);
                        }
                        const node = currentData?.nodes?.find(n => n.id === nodeId);
                        let finalVars = null;
                        if (node) {
                            finalVars = collectNodeVariables(node);
                            finalVars._finishedAt = new Date().toISOString();
                            finalVars._status = 'sim_end';
                        }
                        recordNodeFinishWithVars(currentRunId, nodeId, null, null, finalVars);
                    });
                    activeNodes.clear();
                    particleHandles.forEach(h => h.cancel());
                    particleHandles.clear();
                }

                if (wsReady()) {
                    ws.send(JSON.stringify({ command: 'get_all_node_stats' }));
                    setTimeout(() => {
                        statusEl.className = 'sim-status ended';
                        statusEl.textContent = '⏹ 仿真已结束';
                        showNotification('⏹ 仿真结束');
                        stopRecording();
                    }, 500);
                }
                break;

            case 'node_activate':
                activateNode(msg.nodeId);
                break;

            case 'node_deactivate':
                deactivateNode(msg.nodeId);
                break;

            case 'clear_all':
                clearAllActiveStates();
                break;

            case 'runtime_values':
                updateRuntimeValues(msg.values || {});
                break;

            case 'replay_data':
                startReplay(msg.record);
                break;

            case 'replay_saved': {
                const info = document.getElementById('replayInfo');
                if (info) info.innerHTML = `已保存最近一次回放：<span class="replay-badge">${escapeHtml(msg.runId || '')}</span>`;
                appendEventLog('回放记录已保存：' + (msg.runId || ''), 'info', msg.time);
                break;
            }

            case 'external_interaction_request':
                appendEventLog('⚡ 外部交互请求: ' + (msg.nodeName || ''), 'warn', msg.time);
                showNotification('⚡ 需要外部输入: ' + (msg.nodeName || ''));
                renderExternalInteractionForm(msg);
                break;

            case 'node_stats':
                if (msg.nodeName) {
                    nodeStatsCache[msg.nodeName] = {
                        requiredPeople: msg.requiredPeople,
                        duration: msg.duration,
                        readyTime: msg.readyTime,
                        startTime: msg.startTime,
                        finishTime: msg.finishTime,
                        waitTime: msg.waitTime,
                        totalTime: msg.totalTime,
                        status: msg.status,
                        queuePosition: msg.queuePosition,
                        queueSize: msg.queueSize
                    };

                    if (isRecording && currentRunId) {
                        const node = currentData?.nodes?.find(n => n.name === msg.nodeName);
                        if (node) {
                            if (msg.status === 'ready') {
                                let allProperties = {};
                                if (nodeFullConfigCache.has(msg.nodeName)) {
                                    allProperties = nodeFullConfigCache.get(msg.nodeName).allProperties || {};
                                }
                                recordNodeReadyWithProps(
                                    currentRunId,
                                    node.id,
                                    node.name || '',
                                    node.type || '',
                                    msg.requiredPeople || 0,
                                    node.isStartNode || false,
                                    node.isEndNode || false,
                                    node.description || '',
                                    'ResourceTask',
                                    allProperties
                                );
                            } else if (msg.status === 'waiting') {
                                recordNodeWaiting(currentRunId, node.id, msg.queuePosition, msg.queueSize);
                            }
                        }
                    }

                    if (currentData) {
                        const selectedNode = currentData.nodes.find(n => n.id === selectedNodeId);
                        if (selectedNode && selectedNode.name === msg.nodeName) {
                            const nodeIsActive = msg.status === 'running';
                            showNodePanel(selectedNode, nodeIsActive);
                        }
                    }
                }
                break;

            case 'resource_pool_status':
                appendEventLog(
                    `📊 资源池：总数=${msg.total}，可用=${msg.available}，等待队列=${msg.waitingQueueSize}`,
                    'info', ''
                );
                break;

            case 'resource_log':
                appendEventLog(msg.message || '', msg.level || 'info', msg.time);
                break;

            case 'node_config':
                if (msg.config && msg.taskName) {
                    nodeConfigCache.set(msg.taskName, msg.config);
                }
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            case 'node_config_updated':
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                } else {
                    const statusDiv = document.getElementById('fullConfigSubmitStatus');
                    if (statusDiv) {
                        if (msg.success) {
                            statusDiv.className = 'submit-status success';
                            statusDiv.textContent = '✅ 配置已保存到 MagicDraw';
                            showNotification('✅ 节点 "' + msg.taskName + '" 配置已更新');
                            nodeFullConfigCache.delete(msg.taskName);
                            nodeConfigCache.delete(msg.taskName);
                            setTimeout(() => {
                                if (msg.taskName) loadNodeFullConfig(msg.taskName);
                                updateAllIndicatorValues();
                            }, 500);
                        } else {
                            statusDiv.className = 'submit-status error';
                            statusDiv.textContent = '❌ 保存失败: ' + escapeHtml(msg.error || '未知错误');
                            showNotification('❌ 配置保存失败: ' + (msg.error || '未知错误'), true);
                        }
                    }
                }
                break;

            case 'node_full_config':
                if (msg.config && msg.taskName) {
                    nodeFullConfigCache.set(msg.taskName, msg.config);
                    // 更新指标值
                    updateIndicatorValuesForNode(msg.taskName, msg.config);
                }
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            case 'all_node_configs':
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            case 'node_full_config_updated':
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                } else {
                    const statusDiv = document.getElementById('allPropsSubmitStatus');
                    if (statusDiv) {
                        if (msg.success) {
                            statusDiv.className = 'submit-status success';
                            statusDiv.textContent = '✅ ' + (msg.message || '所有属性已保存');
                            showNotification('✅ 节点 "' + msg.taskName + '" 所有属性已更新');
                            nodeFullConfigCache.delete(msg.taskName);
                            nodeConfigCache.delete(msg.taskName);
                            setTimeout(() => {
                                if (msg.taskName) loadNodeFullConfig(msg.taskName);
                                updateAllIndicatorValues();
                            }, 500);
                        } else {
                            statusDiv.className = 'submit-status error';
                            statusDiv.textContent = '❌ ' + (msg.message || '保存失败');
                            showNotification('❌ 属性保存失败: ' + (msg.message || '未知错误'), true);
                        }
                    }
                }
                break;

            case 'init_body_data':
                renderInitBodyEditor(msg.nodeId, msg.bodies || []);
                break;

            case 'init_body_updated':
                const statusDiv = document.getElementById('initBodyStatus');
                if (statusDiv) {
                    if (msg.success) {
                        statusDiv.className = 'submit-status success';
                        statusDiv.textContent = '✅ 已写回 MagicDraw';
                        showNotification('✅ 初始化 Body 已更新');
                    } else {
                        statusDiv.className = 'submit-status error';
                        statusDiv.textContent = '❌ ' + (msg.error || '未知错误');
                        showNotification('❌ 写回失败: ' + (msg.error || ''), true);
                    }
                }
                break;

            case 'debug_stereotype_info':
                appendEventLog(
                    `🔍 节点 "${msg.taskName}" 的 Stereotype 属性: ` +
                    `hasStereotype=${msg.hasStereotype}, ` +
                    `requiredPeople=${msg.requiredPeople}, ` +
                    `duration=${msg.duration}`,
                    'info'
                );
                showNotification(`🔍 节点 "${msg.taskName}" requiredPeople=${msg.requiredPeople}`);
                break;

            default:
                console.log('未处理的后端事件：', msg);
                break;
        }
    }

    // ========================= 运行变量 & 日志 =========================
    function updateRuntimeValues(values) {
        const tbody = document.getElementById('runtimeValuesBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        const entries = Object.entries(values || {});
        if (entries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="color:#94a3b8;text-align:center;padding:10px;">暂无运行变量</td></tr>';
            return;
        }
        entries.forEach(([name, value]) => {
            const valueText = (value === null || value === undefined) ? '—' : String(value);
            const lower = valueText.toLowerCase();
            const cls = lower === 'true' ? 'true' : (lower === 'false' ? 'false' : '');
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${escapeHtml(name)}</td><td class="runtime-value ${cls}">${escapeHtml(valueText)}</td>`;
            tbody.appendChild(tr);
        });
        document.getElementById('varCount').textContent = `(${entries.length}个变量)`;
    }

    function appendEventLog(message, level, time) {
        const box = document.getElementById('eventLogBox');
        if (!box) return;
        if (box.children.length === 1 && box.children[0].textContent.includes('等待连接')) {
            box.innerHTML = '';
        }
        const div = document.createElement('div');
        div.className = 'log-line ' + (level || 'info');
        div.textContent = (time ? time + '  ' : '') + (message || '');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        while (box.children.length > 1000) {
            box.removeChild(box.firstChild);
        }
    }

    // ========================= 记录控制 =========================
    function startRecording(msg) {
        if (isRecording) {
            appendEventLog('⚠️ 已有正在记录的仿真', 'warn');
            return;
        }

        isRecording = true;
        runStartTime = Date.now();
        sequenceCounter = 0;

        document.getElementById('dbStatus').className = 'db-status recording';
        document.getElementById('dbStatus').textContent = '🔴 记录中';

        if (isDbOnline) {
            const initVars = msg.initVars || {};

            const runData = {
                diagramId: diagramId || '',
                diagramName: diagramName || '未命名流程',
                startMode: msg.mode || 'auto',
                contextName: msg.contextName || '',
                status: 'running',
                userId: 'system',
                remark: '自动记录 - MagicDraw仿真中',
                initVarsMap: initVars
            };

            axios.post(`${API_BASE_URL}/simulationRun/start`, runData)
                .then(response => {
                    if (response.data.code === 200) {
                        currentRunId = response.data.data.id;
                        appendEventLog(`📝 开始自动记录，运行ID: ${currentRunId}`, 'info');

                        if (initVars && Object.keys(initVars).length > 0) {
                            axios.post(`${API_BASE_URL}/simulationRun/initVars/${currentRunId}`, initVars)
                                .then(() => {
                                    appendEventLog(`📝 已保存 ${Object.keys(initVars).length} 个初始化变量`, 'info');
                                })
                                .catch(err => {
                                    console.error('保存初始化变量失败:', err);
                                });
                        }

                        if (currentData && currentData.nodes) {
                            const actionNodes = currentData.nodes.filter(node =>
                                node.type === 'ActionImpl' ||
                                node.type === 'CallBehaviorActionImpl' ||
                                node.type === 'OpaqueActionImpl' ||
                                node.type === 'OpaqueAction'
                            );

                            actionNodes.forEach(node => {
                                const taskName = node.name;
                                if (!taskName) return;

                                let requiredPeople = 1;
                                let allProperties = {};

                                if (nodeFullConfigCache.has(taskName)) {
                                    const config = nodeFullConfigCache.get(taskName);
                                    allProperties = config.allProperties || {};
                                    requiredPeople = allProperties.requiredPeople || 1;
                                } else if (nodeConfigCache.has(taskName)) {
                                    const config = nodeConfigCache.get(taskName);
                                    allProperties = config.allProperties || {};
                                    requiredPeople = config.requiredPeople || 1;
                                }

                                recordNodeReadyWithProps(
                                    currentRunId,
                                    node.id,
                                    node.name || '',
                                    node.type || '',
                                    requiredPeople,
                                    node.isStartNode || false,
                                    node.isEndNode || false,
                                    node.description || '',
                                    'ResourceTask',
                                    allProperties
                                );
                            });
                            appendEventLog(`📝 已初始化 ${actionNodes.length} 个节点记录`, 'info');
                        }
                    } else {
                        currentRunId = 'run_' + Date.now();
                        appendEventLog(`⚠️ 创建运行记录失败: ${response.data.msg}，使用临时ID`, 'warn');
                    }
                })
                .catch(error => {
                    currentRunId = 'run_' + Date.now();
                    appendEventLog(`⚠️ 创建运行记录失败: ${error.message}，使用临时ID`, 'warn');
                });
        } else {
            currentRunId = 'local_' + Date.now();
            appendEventLog(`⚠️ 数据库离线，使用本地记录ID: ${currentRunId}`, 'warn');
        }
    }

    function stopRecording() {
        if (!isRecording) return;

        isRecording = false;
        document.getElementById('dbStatus').className = 'db-status online';
        document.getElementById('dbStatus').textContent = '数据库在线';

        if (currentRunId && isDbOnline) {
            const runId = currentRunId;
            const duration = runStartTime ? (Date.now() - runStartTime) : 0;

            axios.post(`${API_BASE_URL}/simulationRun/end`, null, {
                params: { id: runId }
            })
                .then(response => {
                    if (response.data.code === 200) {
                        appendEventLog(`📝 自动记录结束，运行ID: ${runId}，持续 ${(duration/1000).toFixed(1)}s`, 'info');
                        axios.get(`${API_BASE_URL}/simulationNode/stats/run/${runId}`)
                            .then(statsResp => {
                                if (statsResp.data.code === 200) {
                                    const stats = statsResp.data.data;
                                    appendEventLog(
                                        `📊 统计: 总节点=${stats.totalNodes}, 完成=${stats.completedNodes}, ` +
                                        `运行中=${stats.runningNodes}, 错误=${stats.errorNodes}`,
                                        'info'
                                    );
                                }
                            })
                            .catch(err => console.error('获取统计失败:', err));
                    }
                })
                .catch(error => {
                    console.error('结束运行记录失败:', error);
                })
                .finally(() => {
                    currentRunId = null;
                    runStartTime = null;
                });
        } else {
            currentRunId = null;
            runStartTime = null;
        }
    }

    // ========================= 图数据应用 =========================
    function applyDiagramData(data, name) {
        currentData = data;
        if (!currentData || !currentData.nodes || currentData.nodes.length === 0) {
            showNotification('❌ 图中没有可渲染节点', true);
            const ld = document.getElementById('loadingMsg');
            if (ld) ld.innerHTML = `<div style="color:#D32F2F">❌ 图中没有可渲染节点</div>`;
            return;
        }
        currentData.nodes = currentData.nodes.filter(n => n.type !== 'DiagramImpl');
        if (name) document.getElementById('diagramTitle').innerHTML = '📋 ' + escapeHtml(name);
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('diagramSvg').style.display = 'block';
        initSVG(); renderDiagram();
        setTimeout(fitView, 100);
        showNotification('✅ 已从 MagicDraw 加载图');
    }

    // ========================= 视图控制 =========================
    function zoomIn()    { d3.select('#diagramSvg').transition().duration(200).call(zoomBehavior.scaleBy, 1.2); }
    function zoomOut()   { d3.select('#diagramSvg').transition().duration(200).call(zoomBehavior.scaleBy, .85); }
    function resetView() { d3.select('#diagramSvg').transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity); }
    function fitView() {
        const b = calculateBounds(), svgEl = document.getElementById('diagramSvg');
        const w = svgEl.clientWidth || 800, h = svgEl.clientHeight || 600;
        const sc = Math.min(w / b.width, h / b.height) * .88;
        const tx = (w - b.width * sc) / 2 - b.minX * sc;
        const ty = (h - b.height * sc) / 2 - b.minY * sc;
        d3.select('#diagramSvg').transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));
    }

    function goBack() { ws?.close(); location.href = 'index.html'; }

    // 点击空白处取消选中
    document.getElementById('diagramSvg').addEventListener('click', ev => {
        if (ev.target === ev.currentTarget || ev.target.tagName === 'svg') {
            clearSelection();
            document.getElementById('panelContent').innerHTML = '<div class="empty-state">✨ 点击节点或连线，查看仿真详情</div>';
            currentNodeConfig = null;
            currentConfigTaskName = null;
            currentFullConfig = null;
        }
    });

    // ========================= 指标树 =========================
    const indicatorTreeData = [
        {
            id: 'root',
            name: '关联指标',
            children: [
                {
                    id: 'comprehensive',
                    name: '综合指标',
                    children: [
                        {
                            id: 'time_index',
                            name: '时间' ,
                            children: [
                                { id: 'install_time', name: '装备安装时间' },
                                { id: 'pipe_check_time', name: '管路检测时间' },
                                { id: 'subsystem_test_time', name: '分系统测试时间' },
                                { id: 'filling_time', name: '加注时间' },
                                { id: 'transfer_time', name: '转场时间' }
                            ]
                        },
                        {
                            id: 'manpower_index',
                            name: '人力' ,
                            children: [
                                { id: 'install_manpower', name: '装备安装人力' },
                                { id: 'pipe_check_manpower', name: '管路检测人力' },
                                { id: 'subsystem_test_manpower', name: '分系统测试人力' },
                                { id: 'filling_manpower', name: '加注人力' },
                                { id: 'transfer_manpower', name: '转场人力' }
                            ]
                        }
                    ]
                }
            ]
        }
    ];

    let selectedIndicators = new Set();
    let expandedNodes = new Set(['root', 'comprehensive']);
    let indicatorSearchKeyword = '';

    // ========================= 指标绑定功能 =========================
    function toggleIndicatorPanel() {
        const panel = document.getElementById('indicatorPanel');
        const btn = document.getElementById('backBtn');
        panel.classList.toggle('collapsed');
        const collapsed = panel.classList.contains('collapsed');
        if (btn) btn.style.left = collapsed ? '24px' : '284px';
        const toggleBtn = panel.querySelector('.indicator-toggle');
        if (toggleBtn) toggleBtn.textContent = collapsed ? '▶' : '◀';
    }

    function renderIndicatorTree(data, container, level, parentPath) {
        if (!container) return;
        if (level === undefined) level = 0;
        if (parentPath === undefined) parentPath = [];

        container.innerHTML = '';
        data.forEach(node => {
            renderIndicatorNode(node, container, level, parentPath);
        });
        updateIndicatorBadge();
    }

    function renderIndicatorNode(node, container, level, parentPath) {
        const hasChildren = node.children && node.children.length > 0;
        const isExpanded = expandedNodes.has(node.id);
        const isSelected = selectedIndicators.has(node.id);
        const currentPath = [...parentPath, node];

        if (indicatorSearchKeyword) {
            const keyword = indicatorSearchKeyword.toLowerCase();
            const matchSelf = node.name.toLowerCase().includes(keyword);
            const matchChild = hasChildren && treeNodeHasMatch(node, keyword);
            if (!matchSelf && !matchChild) return;
        }

        const nodeEl = document.createElement('div');
        nodeEl.className = 'tree-node';
        nodeEl.dataset.id = node.id;

        const contentEl = document.createElement('div');
        contentEl.className = 'tree-node-content';
        if (indicatorSearchKeyword && node.name.toLowerCase().includes(indicatorSearchKeyword.toLowerCase())) {
            contentEl.classList.add('matched');
        }
        contentEl.style.paddingLeft = (12 + level * 16) + 'px';

        const toggleEl = document.createElement('span');
        toggleEl.className = 'tree-toggle' + (hasChildren ? '' : ' leaf') + (isExpanded ? '' : ' collapsed');
        toggleEl.innerHTML = '▼';
        toggleEl.onclick = (e) => {
            e.stopPropagation();
            if (!hasChildren) return;
            if (expandedNodes.has(node.id)) {
                expandedNodes.delete(node.id);
            } else {
                expandedNodes.add(node.id);
            }
            refreshIndicatorTree();
        };

        const checkboxEl = document.createElement('input');
        checkboxEl.type = 'checkbox';
        checkboxEl.className = 'tree-checkbox';
        checkboxEl.checked = isSelected;
        checkboxEl.indeterminate = getIndeterminateState(node);
        checkboxEl.onclick = (e) => {
            e.stopPropagation();
            toggleIndicatorNode(node, checkboxEl.checked);
        };

        const labelEl = document.createElement('span');
        labelEl.className = 'tree-label';
        labelEl.textContent = node.name;
        labelEl.title = node.name;
        labelEl.onclick = () => {
            if (hasChildren) {
                if (expandedNodes.has(node.id)) {
                    expandedNodes.delete(node.id);
                } else {
                    expandedNodes.add(node.id);
                }
                refreshIndicatorTree();
            }
        };

        // 显示指标值
        const valueEl = document.createElement('span');
        valueEl.className = 'indicator-value';
        const indicatorData = indicatorValues.get(node.id);
        if (indicatorData && indicatorData.value !== undefined && indicatorData.value !== null) {
            const displayValue = typeof indicatorData.value === 'number' ?
                (Number.isInteger(indicatorData.value) ? indicatorData.value : indicatorData.value.toFixed(2)) :
                indicatorData.value;
            valueEl.textContent = displayValue;
            valueEl.classList.add('has-value');
            if (indicatorData.source) {
                valueEl.title = `来源: ${indicatorData.source}`;
                valueEl.classList.add('bound');
            }
        } else if (indicatorData && indicatorData.loading) {
            valueEl.textContent = '⏳';
            valueEl.className = 'indicator-value waiting';
            valueEl.title = '正在加载...';
        } else if (indicatorData && indicatorData.error) {
            valueEl.textContent = '❌';
            valueEl.className = 'indicator-value unbound';
            valueEl.title = indicatorData.error;
        } else {
            // 检查是否已绑定但无值
            if (indicatorBindings.has(node.id)) {
                valueEl.textContent = '⏳';
                valueEl.className = 'indicator-value waiting';
                valueEl.title = `已绑定到: ${indicatorBindings.get(node.id)}，等待值加载`;
            } else {
                valueEl.textContent = '—';
                valueEl.className = 'indicator-value unbound';
            }
        }

        contentEl.appendChild(toggleEl);
        contentEl.appendChild(checkboxEl);
        contentEl.appendChild(labelEl);
        contentEl.appendChild(valueEl);
        nodeEl.appendChild(contentEl);

        if (hasChildren) {
            const childrenEl = document.createElement('div');
            childrenEl.className = 'tree-children' + (isExpanded ? '' : ' collapsed');
            node.children.forEach(child => {
                renderIndicatorNode(child, childrenEl, level + 1, currentPath);
            });
            nodeEl.appendChild(childrenEl);
        }

        container.appendChild(nodeEl);
    }

    function treeNodeHasMatch(node, keyword) {
        if (node.name.toLowerCase().includes(keyword)) return true;
        if (node.children) {
            for (const child of node.children) {
                if (treeNodeHasMatch(child, keyword)) return true;
            }
        }
        return false;
    }

    function getIndeterminateState(node) {
        if (!node.children || node.children.length === 0) return false;
        const childIds = getAllDescendantIds(node);
        const selectedCount = childIds.filter(id => selectedIndicators.has(id)).length;
        if (selectedCount === 0) return false;
        if (selectedCount === childIds.length) return false;
        return true;
    }

    function getAllDescendantIds(node) {
        let ids = [];
        if (node.children) {
            node.children.forEach(child => {
                ids.push(child.id);
                ids = ids.concat(getAllDescendantIds(child));
            });
        }
        return ids;
    }

    function getAllDescendants(node) {
        let nodes = [];
        if (node.children) {
            node.children.forEach(child => {
                nodes.push(child);
                nodes = nodes.concat(getAllDescendants(child));
            });
        }
        return nodes;
    }

    function toggleIndicatorNode(node, checked) {
        if (checked) {
            selectedIndicators.add(node.id);
        } else {
            selectedIndicators.delete(node.id);
        }
        const descendants = getAllDescendants(node);
        descendants.forEach(d => {
            if (checked) selectedIndicators.add(d.id);
            else selectedIndicators.delete(d.id);
        });
        refreshIndicatorTree();
    }

    function refreshIndicatorTree() {
        const container = document.getElementById('indicatorTree');
        renderIndicatorTree(indicatorTreeData, container);
    }

    function searchIndicators(keyword) {
        indicatorSearchKeyword = keyword.trim();
        if (indicatorSearchKeyword) {
            expandForSearch(indicatorTreeData, indicatorSearchKeyword.toLowerCase());
        }
        refreshIndicatorTree();
    }

    function expandForSearch(nodes, keyword) {
        nodes.forEach(node => {
            if (node.children) {
                const childMatch = treeNodeHasMatch(node, keyword);
                if (childMatch) {
                    expandedNodes.add(node.id);
                }
                expandForSearch(node.children, keyword);
            }
        });
    }

    function updateIndicatorBadge() {
        const header = document.querySelector('.indicator-header h3');
        if (!header) return;
        const count = selectedIndicators.size;
        let badge = header.querySelector('.indicator-badge');
        if (!badge) {
            badge = document.createElement('span');
            badge.className = 'indicator-badge';
            header.appendChild(badge);
        }
        badge.textContent = count;
        badge.style.display = count > 0 ? 'inline-block' : 'none';
    }

    function getSelectedIndicators() {
        const result = [];
        const collect = (nodes) => {
            nodes.forEach(node => {
                if (selectedIndicators.has(node.id)) {
                    result.push({ id: node.id, name: node.name });
                }
                if (node.children) collect(node.children);
            });
        };
        collect(indicatorTreeData);
        return result;
    }

    // ========================= 确认绑定（增强版） =========================
    function confirmIndicatorBind() {
        const selected = getSelectedIndicators();
        if (selected.length === 0) {
            showNotification('⚠️ 请至少选择一个指标', true);
            return;
        }

        // 获取当前选中的节点
        let targetNode = null;
        if (selectedNodeId && currentData) {
            targetNode = currentData.nodes.find(n => n.id === selectedNodeId);
        }

        if (targetNode) {
            const nodeName = targetNode.name;
            if (!nodeName) {
                showNotification('⚠️ 当前选中的节点没有名称，无法绑定', true);
                return;
            }

            // 绑定选中的指标到当前节点
            selected.forEach(indicator => {
                indicatorBindings.set(indicator.id, nodeName);
                appendEventLog(`📌 绑定指标 "${indicator.name}" 到节点 "${nodeName}"`, 'info');
            });

            // 先尝试从缓存读取配置
            let config = null;
            if (nodeFullConfigCache.has(nodeName)) {
                config = nodeFullConfigCache.get(nodeName);
                console.log(`📦 从 fullConfigCache 获取配置:`, config);
            } else if (nodeConfigCache.has(nodeName)) {
                config = nodeConfigCache.get(nodeName);
                console.log(`📦 从 nodeConfigCache 获取配置:`, config);
            }

            if (config) {
                // 直接更新指标值
                updateIndicatorValuesForNode(nodeName, config);
                showNotification(`✅ 已绑定 ${selected.length} 个指标到节点 "${nodeName}"，并读取了配置值`);
            } else {
                // 如果缓存中没有，先设置一个占位状态，然后主动加载配置
                selected.forEach(indicator => {
                    indicatorValues.set(indicator.id, {
                        value: null,
                        source: nodeName,
                        timestamp: new Date().toISOString(),
                        loading: true
                    });
                });
                refreshIndicatorTree();

                // 主动加载配置
                appendEventLog(`⏳ 正在加载节点 "${nodeName}" 的配置...`, 'info');
                showNotification(`⏳ 正在加载节点 "${nodeName}" 的配置...`);

                // 调用加载配置的函数，加载完成后会自动更新指标值
                loadNodeFullConfig(nodeName);
            }
        } else {
            // 没有选中节点，只记录选择
            appendEventLog(`📌 已选指标: ${selected.map(s => s.name).join(', ')}，请点击节点完成绑定`, 'info');
            showNotification(`✅ 已选择 ${selected.length} 个指标（请点击节点完成绑定）`);
        }
    }

    function clearIndicatorSelection() {
        selectedIndicators.clear();
        refreshIndicatorTree();
        showNotification('🗑 已清空指标选择');
    }

    // ========================= 计算结果 =========================
    function calculateIndicatorResults() {
        const results = [];
        const allIndicators = [];

        // 收集所有叶子节点的指标
        const collectIndicators = (nodes) => {
            nodes.forEach(node => {
                if (node.children && node.children.length > 0) {
                    collectIndicators(node.children);
                } else {
                    allIndicators.push(node);
                }
            });
        };
        collectIndicators(indicatorTreeData);

        allIndicators.forEach(indicator => {
            const valueData = indicatorValues.get(indicator.id);
            if (valueData && valueData.value !== undefined && valueData.value !== null) {
                const numValue = parseFloat(valueData.value);
                results.push({
                    id: indicator.id,
                    name: indicator.name,
                    value: !isNaN(numValue) ? numValue : valueData.value,
                    source: valueData.source || '未知',
                    timestamp: valueData.timestamp || new Date().toISOString(),
                    raw: valueData.value
                });
            } else if (valueData && valueData.loading) {
                const boundNode = indicatorBindings.get(indicator.id);
                results.push({
                    id: indicator.id,
                    name: indicator.name,
                    value: null,
                    source: boundNode || '加载中',
                    timestamp: new Date().toISOString(),
                    raw: null,
                    status: '加载中'
                });
            } else {
                // 检查是否有绑定但无值
                const boundNode = indicatorBindings.get(indicator.id);
                results.push({
                    id: indicator.id,
                    name: indicator.name,
                    value: null,
                    source: boundNode || '未绑定',
                    timestamp: new Date().toISOString(),
                    raw: null,
                    status: boundNode ? '等待值' : '未绑定'
                });
            }
        });

        // 显示结果面板
        const panel = document.getElementById('indicatorResultPanel');
        const content = document.getElementById('indicatorResultContent');

        // 计算汇总统计
        const numericResults = results.filter(r => typeof r.value === 'number' && !isNaN(r.value));
        const total = numericResults.reduce((sum, r) => sum + r.value, 0);
        const avg = numericResults.length > 0 ? total / numericResults.length : 0;
        const max = numericResults.length > 0 ? Math.max(...numericResults.map(r => r.value)) : 0;
        const min = numericResults.length > 0 ? Math.min(...numericResults.map(r => r.value)) : 0;

        let html = `
        <div style="background:#f8fafc;padding:8px 12px;border-radius:6px;margin-bottom:10px;">
            <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;">
                <span>📊 有效指标: <b>${numericResults.length}/${results.length}</b></span>
                <span>📈 总和: <b>${total.toFixed(2)}</b></span>
                <span>📊 平均值: <b>${avg.toFixed(2)}</b></span>
                <span>⬆ 最大值: <b>${max.toFixed(2)}</b></span>
                <span>⬇ 最小值: <b>${min.toFixed(2)}</b></span>
            </div>
        </div>
        <div style="max-height:300px;overflow-y:auto;">`;

        results.forEach(r => {
            let valueDisplay = '—';
            let statusClass = '';
            if (r.value !== null && r.value !== undefined) {
                if (typeof r.value === 'number') {
                    valueDisplay = r.value.toFixed(2);
                } else {
                    valueDisplay = String(r.value);
                }
                statusClass = 'has-value';
            } else if (r.status === '加载中') {
                valueDisplay = '⏳ 加载中';
                statusClass = 'waiting';
            } else if (r.status === '等待值') {
                valueDisplay = '⏳ 等待值';
                statusClass = 'waiting';
            } else {
                valueDisplay = '❌ 未绑定';
                statusClass = 'unbound';
            }

            html += `
            <div class="result-item">
                <span class="name">${escapeHtml(r.name)}</span>
                <span class="value ${statusClass}">${escapeHtml(valueDisplay)}</span>
                <span class="source">${escapeHtml(r.source)}</span>
            </div>`;
        });

        html += '</div>';
        content.innerHTML = html;
        panel.classList.add('show');
    }

    function closeIndicatorResult() {
        document.getElementById('indicatorResultPanel').classList.remove('show');
    }

    // ========================= 启动 =========================
    refreshIndicatorTree();
    loadJSON();
</script>
