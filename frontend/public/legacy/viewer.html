<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MagicDraw 动态仿真同步看板</title>
    <script src="lib/d3.v7.min.js">
    </script>
    <script src="lib/axios.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #d0d5da;
            height: 100vh;
            display: flex;
            overflow: hidden;
            color: #1e2a4a;
        }

        .indicator-panel {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #c0c8d0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.3s ease, margin 0.3s ease;
            z-index: 150;
        }
        .indicator-panel.collapsed {
            width: 0;
            border-right: none;
        }
        .indicator-header {
            padding: 12px 14px;
            border-bottom: 1px solid #dce0e6;
            background: #f5f6f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .indicator-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: #1e2a4a;
            margin: 0;
        }
        .indicator-toggle {
            background: none;
            border: none;
            font-size: 12px;
            color: #7b8ba3;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .indicator-toggle:hover {
            background: #eef3fa;
        }
        .indicator-search {
            padding: 10px 14px;
            border-bottom: 1px solid #dce0e6;
            flex-shrink: 0;
        }
        .indicator-search input {
            width: 100%;
            padding: 6px 12px;
            border: 1px solid #c8d0d8;
            border-radius: 20px;
            font-size: 12px;
            background: #fafcff;
            outline: none;
            transition: border-color 0.2s;
        }
        .indicator-search input:focus {
            border-color: #3b7cff;
            box-shadow: 0 0 0 2px rgba(59, 124, 255, 0.08);
        }
        .indicator-tree {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
            font-size: 12px;
            user-select: none;
        }
        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 5px 10px 5px 12px;
            cursor: pointer;
            transition: background 0.12s;
            gap: 4px;
        }
        .tree-node-content:hover {
            background: #f0f5fe;
        }
        .tree-node-content.matched {
            background: #f5f9ff;
        }
        .tree-toggle {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #7b8ba3;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .tree-toggle.collapsed {
            transform: rotate(-90deg);
        }
        .tree-toggle.leaf {
            visibility: hidden;
        }
        .tree-checkbox {
            width: 14px;
            height: 14px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #3b7cff;
            margin: 0;
        }
        .tree-label {
            color: #1e2a4a;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
        }
        .tree-children {
            overflow: hidden;
            transition: max-height 0.25s ease;
        }
        .tree-children.collapsed {
            max-height: 0;
        }
        .indicator-footer {
            padding: 10px 14px;
            border-top: 1px solid #dce0e6;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .indicator-footer button {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            background: #f0f5fe;
            color: #1e2a4a;
        }
        .indicator-footer .btn-primary {
            background: #3b7cff;
            color: white;
        }
        .indicator-footer .btn-primary:hover {
            background: #2a66d9;
        }
        .indicator-footer .btn-secondary {
            background: #e8edf5;
            color: #1e2a4a;
        }
        .indicator-footer .btn-secondary:hover {
            background: #d5dde9;
        }
        .indicator-footer .calc-btn {
            background: #3b7cff;
            color: white;
        }
        .indicator-footer .calc-btn:hover {
            background: #2a66d9;
        }
        .indicator-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 12px;
            background: #dbe7fe;
            color: #1e4fbf;
            font-size: 10px;
            font-weight: 600;
            margin-left: auto;
        }
        .indicator-value {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: auto;
            background: #f0f5fe;
            color: #4a5e7a;
            min-width: 30px;
            text-align: center;
        }
        .indicator-value.has-value {
            background: #dbe7fe;
            color: #1e4fbf;
        }
        .indicator-value.bound {
            background: #d4f0db;
            color: #1a7a4a;
        }
        .indicator-value.waiting {
            background: #fef3d0;
            color: #b47c2e;
        }
        .indicator-value.unbound {
            background: #f0f5fe;
            color: #7b8ba3;
        }

        .indicator-result-panel {
            position: fixed;
            bottom: 80px;
            left: 280px;
            background: white;
            border-radius: 12px;
            padding: 18px 22px;
            box-shadow: 0 6px 24px rgba(0, 20, 60, 0.12);
            border: 1px solid #c0c8d0;
            z-index: 100;
            max-width: 420px;
            min-width: 300px;
            display: none;
        }
        .indicator-result-panel.show {
            display: block;
        }
        .indicator-result-panel h4 {
            font-size: 14px;
            font-weight: 600;
            color: #1e2a4a;
            margin-bottom: 12px;
        }
        .indicator-result-panel .result-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid #eef3fa;
        }
        .indicator-result-panel .result-item .name {
            color: #4a5e7a;
            flex: 1;
        }
        .indicator-result-panel .result-item .value {
            font-weight: 600;
            color: #1e2a4a;
            min-width: 50px;
            text-align: right;
        }
        .indicator-result-panel .result-item .value.has-value {
            color: #1e4fbf;
        }
        .indicator-result-panel .result-item .value.waiting {
            color: #b47c2e;
        }
        .indicator-result-panel .result-item .value.unbound {
            color: #7b8ba3;
        }
        .indicator-result-panel .result-item .source {
            font-size: 9px;
            color: #7b8ba3;
            min-width: 60px;
            text-align: right;
        }
        .indicator-result-panel .close-btn {
            position: absolute;
            top: 8px;
            right: 14px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #7b8ba3;
        }
        .indicator-result-panel .close-btn:hover {
            color: #1e2a4a;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: #c4ccd4;
            overflow: hidden;
        }

        svg#diagramSvg {
            display: block;
            cursor: grab;
            background: #ffffff;
            box-shadow: 0 0 0 1px #a0a8b0, 0 4px 16px rgba(0, 0, 0, 0.12);
            margin: 24px;
            border-radius: 0;
        }
        svg#diagramSvg:active {
            cursor: grabbing;
        }

        .uml-action {
            fill: #e1e1c3;
            stroke: #99995c;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill .15s, stroke .15s;
        }
        .uml-action:hover {
            fill: #d4d4b0;
        }
        .uml-action.sim-active {
            fill: #ffe0e0 !important;
            stroke: #cc0000 !important;
            stroke-width: 2.5 !important;
        }
        .uml-action.node-done {
            fill: #d8f0d8 !important;
            stroke: #2d7a2d !important;
            stroke-width: 2 !important;
        }
        .uml-action.selected {
            stroke: #cc0000 !important;
            stroke-width: 3 !important;
        }
        .uml-action.has-subprocess {
            stroke: #99995c !important;
            stroke-width: 2.5px !important;
        }
        .uml-action.state-active {
            fill: #ffe0e0 !important;
            stroke: #cc0000 !important;
            stroke-width: 3 !important;
        }
        .uml-action.state-done {
            fill: #d8f0d8 !important;
            stroke: #2d7a2d !important;
            stroke-width: 2 !important;
        }

        .uml-bar {
            fill: #3d3d3d;
            stroke: none;
            cursor: pointer;
        }
        .uml-bar.sim-active {
            fill: #cc0000 !important;
        }
        .uml-bar.node-done {
            fill: #2d7a2d !important;
        }

        .uml-initial {
            fill: #3d3d3d;
            stroke: none;
            cursor: pointer;
        }
        .uml-initial.sim-active {
            fill: #cc0000 !important;
        }
        .uml-initial.node-done {
            fill: #2d7a2d !important;
        }
        .uml-initial.state-active {
            fill: #cc0000 !important;
            stroke: #cc0000 !important;
            stroke-width: 2 !important;
        }
        .uml-initial.state-done {
            fill: #2d7a2d !important;
            stroke: #2d7a2d !important;
        }

        .uml-final-ring {
            fill: none;
            stroke: #3d3d3d;
            stroke-width: 2;
            cursor: pointer;
        }
        .uml-final-dot {
            fill: #3d3d3d;
            stroke: none;
            cursor: pointer;
        }
        .uml-final-ring.sim-active {
            stroke: #cc0000 !important;
        }
        .uml-final-dot.sim-active {
            fill: #cc0000 !important;
        }
        .uml-final-ring.node-done {
            stroke: #2d7a2d !important;
        }
        .uml-final-dot.node-done {
            fill: #2d7a2d !important;
        }

        [data-selected="true"] .uml-action,
        [data-selected="true"] .uml-bar,
        [data-selected="true"] .uml-initial,
        [data-selected="true"] .uml-final-ring {
            stroke: #cc0000 !important;
            stroke-width: 3 !important;
        }

        .uml-edge {
            fill: none;
            stroke: #6b6b6b;
            stroke-width: 1.5;
            cursor: pointer;
            transition: stroke .15s;
        }
        .uml-edge.dashed {
            stroke-dasharray: 7 4;
        }
        .uml-edge:hover {
            stroke: #cc0000;
            stroke-width: 2;
        }
        .uml-edge.edge-active {
            stroke: #cc0000 !important;
            stroke-width: 2.5 !important;
            marker-end: url(#arr-a) !important;
        }
        .uml-edge.edge-done {
            stroke: #2d7a2d !important;
            stroke-width: 2 !important;
            marker-end: url(#arr-d) !important;
        }
        .uml-edge.selected {
            stroke: #cc0000 !important;
            stroke-width: 2.5 !important;
        }

        .edge-hit {
            fill: none;
            stroke: transparent;
            stroke-width: 14;
            cursor: pointer;
        }

        .edge-lbl {
            font-size: 11px;
            fill: #4a5e7a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            pointer-events: none;
            user-select: none;
        }

        .node-lbl {
            font-size: 11px;
            fill: #1a1a1a;
            font-family: Arial, sans-serif;
            font-weight: 400;
            pointer-events: none;
            user-select: none;
            text-anchor: middle;
            dominant-baseline: auto;
        }

        .flow-particle {
            pointer-events: none;
        }

        .subprocess-marker {
            cursor: pointer;
            pointer-events: all;
        }
        .subprocess-marker:hover circle {
            fill: #b30000;
        }
        .subprocess-marker:hover {
            transform: scale(1.15);
            transition: transform 0.15s;
        }

        /* 泳道样式 - UML风格：顶部标题栏 + 左右边框，底部开放 */
        .swimlane-top {
            fill: #f5f6f8;
            stroke: #000000;
            stroke-width: 1.5;
            pointer-events: none;
        }
        .swimlane-top.selected {
            stroke: #cc0000 !important;
            stroke-width: 3 !important;
        }
        .swimlane-left {
            stroke: #000000;
            stroke-width: 1.5;
            pointer-events: none;
        }
        .swimlane-right {
            stroke: #000000;
            stroke-width: 1.5;
            pointer-events: none;
        }
        .swimlane-title {
            font-size: 12px;
            font-weight: 600;
            fill: #000000;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }
        .swimlane-clickable {
            cursor: pointer;
        }
        .swimlane-clickable:hover .swimlane-top {
            stroke-width: 2.5;
        }
        .swimlane-clickable:hover .swimlane-left {
            stroke-width: 2.5;
        }
        .swimlane-clickable:hover .swimlane-right {
            stroke-width: 2.5;
        }

        .breadcrumb-nav {
            position: fixed;
            top: 70px;
            left: 280px;
            right: 438px;
            background: white;
            padding: 6px 16px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 20, 60, 0.04);
            border: 1px solid #c0c8d0;
            z-index: 150;
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #4a5e7a;
            min-height: 36px;
            flex-wrap: wrap;
            margin: 0 24px;
        }
        .breadcrumb-nav .crumb-link {
            color: #3b7cff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .breadcrumb-nav .crumb-link:hover {
            background: #eef3fa;
        }
        .breadcrumb-nav .crumb-current {
            font-weight: 600;
            color: #1e2a4a;
        }
        .breadcrumb-nav .subprocess-badge {
            background: #dbe7fe;
            color: #1e4fbf;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .breadcrumb-nav .back-to-parent {
            margin-left: auto;
            padding: 3px 14px;
            background: #f0f5fe;
            border: none;
            border-radius: 16px;
            font-size: 11px;
            color: #1e2a4a;
            cursor: pointer;
            transition: background 0.15s;
            font-weight: 500;
        }
        .breadcrumb-nav .back-to-parent:hover {
            background: #e0e8f5;
        }
        .breadcrumb-nav .level-indicator {
            background: #e8f0fa;
            color: #1e4fbf;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .breadcrumb-nav .diagram-info {
            font-size: 11px;
            color: #7b8ba3;
        }

        .info-panel {
            width: 420px;
            background: #ffffff;
            border-left: 1px solid #c0c8d0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .panel-header {
            padding: 16px 18px 10px;
            border-bottom: 1px solid #eef3fa;
            background: #fafcff;
            flex-shrink: 0;
        }
        .panel-header h2 {
            font-size: 15px;
            font-weight: 600;
            color: #0a1a3a;
        }
        .panel-header p {
            font-size: 12px;
            color: #7b8ba3;
            margin-top: 2px;
        }
        .panel-content {
            flex: 1;
            padding: 14px 18px 4px;
            overflow-y: auto;
        }
        .info-section {
            margin-bottom: 14px;
            border-bottom: 1px solid #eef3fa;
            padding-bottom: 10px;
        }
        .info-section h3 {
            font-size: 11px;
            font-weight: 600;
            color: #4a5e7a;
            letter-spacing: .3px;
            margin-bottom: 8px;
        }
        .info-row {
            display: flex;
            margin-bottom: 5px;
            font-size: 12px;
        }
        .info-label {
            width: 70px;
            font-weight: 500;
            color: #7b8ba3;
            flex-shrink: 0;
        }
        .info-value {
            flex: 1;
            color: #0a1a3a;
            word-break: break-word;
        }

        #subprocessSection {
            border-left: 3px solid #cc0000;
            padding-left: 10px;
            background: #f8faff;
            border-radius: 0 6px 6px 0;
            padding-bottom: 6px !important;
        }
        #subprocessSection .subprocess-status {
            font-size: 12px;
            color: #4a5e7a;
            padding: 2px 0;
        }
        #subprocessSection .subprocess-status .has-diagram {
            color: #2d7a2d;
            font-weight: 500;
        }
        #subprocessSection .subprocess-status .no-diagram {
            color: #cc7a00;
            font-weight: 500;
        }
        #subprocessSection .subprocess-name {
            font-weight: 600;
            color: #cc0000;
        }
        #subprocessSection .subprocess-hint {
            font-size: 10px;
            color: #7b8ba3;
            margin-top: 4px;
        }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        .badge-active {
            background: #ffe0e0;
            color: #cc0000;
        }
        .badge-done {
            background: #d8f0d8;
            color: #2d7a2d;
        }
        .badge-idle {
            background: #e8edf5;
            color: #4a5e7a;
        }
        .badge-waiting {
            background: #fef3d0;
            color: #b47c2e;
        }
        .badge-subprocess {
            background: #dbe7fe;
            color: #1e4fbf;
        }
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: #7b8ba3;
            font-size: 12px;
        }

        .config-editor {
            background: #f8faff;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #c0c8d0;
        }
        .config-editor .field-group {
            margin-bottom: 8px;
        }
        .config-editor .field-group:last-of-type {
            margin-bottom: 10px;
        }
        .config-editor label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #4a5e7a;
            margin-bottom: 2px;
        }
        .config-editor input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #c8d0d8;
            border-radius: 6px;
            font-size: 12px;
            background: white;
            transition: border-color 0.2s;
        }
        .config-editor input:focus {
            outline: none;
            border-color: #3b7cff;
            box-shadow: 0 0 0 2px rgba(59, 124, 255, 0.08);
        }
        .config-editor input:disabled {
            background: #f0f5fe;
            color: #7b8ba3;
        }
        .config-editor .submit-btn {
            width: 100%;
            padding: 7px;
            background: #3b7cff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .config-editor .submit-btn:hover {
            background: #2a66d9;
        }
        .config-editor .submit-btn:disabled {
            background: #c8d0d8;
            cursor: not-allowed;
        }
        .config-editor .submit-status {
            font-size: 11px;
            margin-top: 6px;
            color: #4a5e7a;
        }
        .config-editor .submit-status.success {
            color: #2d7a2d;
        }
        .config-editor .submit-status.error {
            color: #cc0000;
        }
        .config-editor .submit-status.loading {
            color: #3b7cff;
        }

        .props-table {
            width: 100%;
            font-size: 11px;
            border-collapse: collapse;
        }
        .props-table thead th {
            text-align: left;
            padding: 4px 6px;
            color: #4a5e7a;
            border-bottom: 1px solid #c0c8d0;
            font-weight: 600;
        }
        .props-table tbody td {
            padding: 4px 6px;
            border-bottom: 1px solid #eef3fa;
        }
        .props-table .prop-name {
            font-weight: 500;
            color: #0a1a3a;
        }
        .props-table .prop-value {
            font-family: 'Consolas', monospace;
            font-size: 10px;
            color: #0a1a3a;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .props-table .prop-type {
            color: #7b8ba3;
            font-size: 9px;
        }

        .config-summary-card {
            background: #f8faff;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #c0c8d0;
            margin-top: 8px;
        }
        .config-summary-card .stats-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #4a5e7a;
        }
        .config-summary-card .stats-row span {
            background: white;
            padding: 4px 12px;
            border-radius: 16px;
            border: 1px solid #c0c8d0;
        }
        .config-summary-card .stats-row .num {
            font-weight: 600;
            color: #0a1a3a;
        }

        .code-block {
            background: #0a1a3a;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            font-size: 10px;
            font-family: 'Consolas', monospace;
            overflow-x: auto;
            max-height: 200px;
            margin: 4px 0 0 0;
            white-space: pre-wrap;

<body>

<!-- 左侧指标树面板 -->
<div class="indicator-panel" id="indicatorPanel">
    <div class="indicator-header">
        <h3>指标树绑定</h3>
        <button class="indicator-toggle" onclick="toggleIndicatorPanel()" title="折叠/展开">◀</button>
    </div>
    <div class="indicator-search">
        <input type="text" id="indicatorSearch" placeholder="搜索指标..." oninput="searchIndicators(this.value)">
    </div>
    <div class="indicator-tree" id="indicatorTree">
        <!-- 动态渲染 -->
    </div>
    <div class="indicator-footer">
        <button class="btn-primary" onclick="confirmIndicatorBind()">确认绑定</button>
        <button class="btn-secondary" onclick="clearIndicatorSelection()">清空</button>
        <button class="calc-btn" onclick="calculateIndicatorResults()">计算结果</button>
    </div>
</div>

<!-- 指标结果面板 -->
<div class="indicator-result-panel" id="indicatorResultPanel">
    <button class="close-btn" onclick="closeIndicatorResult()">×</button>
    <h4>指标计算结果</h4>
    <div id="indicatorResultContent">
        <!-- 动态渲染 -->
    </div>
</div>

<button class="back-btn" id="backBtn" onclick="goBack()">← 返回仪表板</button>

<!-- 面包屑导航 -->
<div class="breadcrumb-nav" id="breadcrumbNav">
    <div class="crumb">
        <span class="crumb-link" onclick="navigateToRootDiagram()">主图</span>
    </div>
    <span class="crumb-sep" id="crumbSep1">›</span>
    <div class="crumb" id="currentCrumb">
        <span class="crumb-current" id="currentDiagramName">加载中...</span>
        <span class="subprocess-badge">子流程</span>
    </div>
    <span class="level-indicator" id="levelIndicator">层级 1</span>
    <span class="diagram-info" id="diagramInfo"></span>
    <button class="back-to-parent" onclick="navigateToParentDiagram()">← 返回上级</button>
</div>

<!-- 顶部仿真控制栏 -->
<div class="sim-control-bar">
    <span id="simStatus" class="sim-status">未连接</span>
    <span id="dbStatus" class="db-status offline">数据库离线</span>

    <div class="scheme-control" title="每次仿真建议使用不同的方案名称，便于历史对比">
        <label for="schemeNameInput">方案</label>
        <input id="schemeNameInput" type="text" maxlength="60" placeholder="例如：方案A">
    </div>

    <div class="speed-control">
        <span class="speed-label">速度</span>
        <input id="speedSlider" type="range" min="0.25" max="3" step="0.25" value="1"
               oninput="onSpeedChange(this.value)">
        <span id="speedValue" class="speed-value">1.0x</span>
    </div>

    <button id="connectBtn" class="ctrl-btn" onclick="toggleConnection()">连接</button>
    <button id="startSimBtn" class="ctrl-btn ctrl-btn-primary" onclick="sendStartSimulation()" disabled>开始</button>
    <button id="startContextBtn" class="ctrl-btn ctrl-btn-primary" onclick="sendStartSimulationWithContext()" disabled>Context</button>
    <button id="stopSimBtn" class="ctrl-btn ctrl-btn-danger" onclick="sendStopSimulation()" disabled>终止</button>
    <button id="startConfigBtn" class="ctrl-btn ctrl-btn-warning" onclick="sendStartSimulationConfig()" disabled>配置</button>
    <button id="replayBtn" class="ctrl-btn" onclick="requestLatestReplay()" disabled>回放</button>
</div>

<div class="canvas-container">
    <div id="loadingMsg" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);

<script>
    // ========================= 全局状态 =========================
    let currentData = null;
    let zoomGroup = null;
    let zoomBehavior = null;
    let currentZoom = 1;
    let isConnected = false;
    let ws = null;
    let diagramRequested = false;
    let simSpeed = 1.0;
    let isStateMachineDiagram = false;

    const nodeConfigCache = new Map();
    const nodeFullConfigCache = new Map();
    const subprocessInfoCache = new Map();

    let allNodeConfigsLoaded = false;
    let allNodeConfigsLoadingPromise = null;
    let latestRuntimeValues = {};
    window._configCallbacks = {};

    let replayTimer = null;
    let replayEvents = [];
    let replayIndex = 0;
    let replayStartTime = 0;
    let replaySpeed = 1.0;

    const activeNodes = new Set();
    const visitedNodes = new Set();
    const visitedEdges = new Set();
    const deactivateTimers = new Map();
    const particleHandles = new Map();
    const nodeStatsCache = {};

    let selectedNodeId = null;
    let selectedEdgeId = null;

    const BASE_MIN_ACTIVE_MS = 800;
    const BASE_PARTICLE_DURATION = 500;
    const PARTICLE_RADIUS = 5;

    const API_BASE_URL = 'http://localhost:8001';
    let currentRunId = null;
    let sequenceCounter = 0;
    let isDbOnline = false;
    let isRecording = false;
    let runStartTime = null;
    let lastVariableTime = null;
    let diagramId = getUrlParam('diagramId') || '';
    let diagramName = getUrlParam('name') || '未命名流程';

    // ========================= 多方案仿真状态 =========================
    let pendingSchemeName = '';
    let activeSchemeName = '';
    let lastSimulationSummary = null;
    let runRecordReadyPromise = Promise.resolve(null);
    let summarySavePromise = Promise.resolve();
    let lastSummarySavedRunId = null;

    const indicatorBindings = new Map();
    const indicatorValues = new Map();

    let navigationStack = [];
    let isInSubprocess = false;
    let currentSubprocessNodeId = null;
    let currentSubprocessParentData = null;

    let triggerList = [];

    const NODE_STYLE_MAP = {
        CallBehaviorActionImpl: { shape: 'action', rake: true },
        ActivityFinalNodeImpl: { shape: 'final' },
        InitialNodeImpl: { shape: 'initial' },
        ActionImpl: { shape: 'action' },
        DecisionNodeImpl: { shape: 'diamond' },
        ForkNodeImpl: { shape: 'bar', label: '分叉' },
        JoinNodeImpl: { shape: 'bar', label: '汇合' },
        OutputPinImpl: { shape: 'pin' },
        InputPinImpl: { shape: 'pin' },
        default: { shape: 'action' }
    };

    function getNodeStyle(type) { return NODE_STYLE_MAP[type] || NODE_STYLE_MAP.default; }

    // ========================= 辅助函数 =========================
    function getUrlParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }


    function makeDefaultSchemeName() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return '方案_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate())
            + '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
    }

    function getSchemeNameForStart() {
        const input = document.getElementById('schemeNameInput');
        let value = input ? input.value.trim() : '';
        if (!value) {
            value = makeDefaultSchemeName();
            if (input) input.value = value;
        }
        return value;
    }

    function buildCurrentPlanSnapshot() {
        const tasks = [];
        const nodes = currentData?.nodes || [];
        nodes.forEach(node => {
            if (!node || !node.name) return;
            const config = getCachedNodeConfig(node.name);
            const props = extractConfigProperties(config);
            const hasResourceTask = props.requiredPeople !== undefined || props.duration !== undefined;
            if (!hasResourceTask) return;

            const requiredPeople = Number(props.requiredPeople);
            const duration = Number(props.duration);
            tasks.push({
                nodeId: node.id || '',
                taskName: node.name || '',
                requiredPeople: Number.isFinite(requiredPeople) ? requiredPeople : 0,
                duration: Number.isFinite(duration) ? duration : 0
            });
        });
        return tasks;
    }

    function prepareSchemeBeforeStart() {
        pendingSchemeName = getSchemeNameForStart();
        activeSchemeName = pendingSchemeName;
        lastSimulationSummary = null;
        lastSummarySavedRunId = null;
        summarySavePromise = Promise.resolve();
        appendEventLog('准备运行方案：' + activeSchemeName, 'info');
        return activeSchemeName;
    }

    function finiteNumber(value, fallback = 0) {
        const n = Number(value);
        return Number.isFinite(n) ? n : fallback;
    }

    function normalizeSimulationSummary(msg) {
        const planSnapshot = buildCurrentPlanSnapshot();
        const tasks = Array.isArray(msg?.tasks) && msg.tasks.length > 0 ? msg.tasks : planSnapshot;
        const dailyResources = Array.isArray(msg?.dailyResources) ? msg.dailyResources : [];
        return {
            recordType: 'SIMULATION_SUMMARY',
            schemeName: activeSchemeName || pendingSchemeName || getSchemeNameForStart(),
            diagramId: diagramId || '',
            diagramName: diagramName || '未命名流程',
            timeUnit: msg?.timeUnit || 'day',
            durationUnit: msg?.durationUnit || 'day',
            resourceUnit: msg?.resourceUnit || 'person',
            totalOperators: finiteNumber(msg?.totalOperators),
            totalDuration: finiteNumber(msg?.totalDuration ?? msg?.totalTime),
            completedNodes: finiteNumber(msg?.completedNodes),
            totalPersonDays: finiteNumber(msg?.totalPersonDays),
            averageResourceUsage: finiteNumber(msg?.averageResourceUsage),
            peakDailyResourceUsage: finiteNumber(msg?.peakDailyResourceUsage),
            totalWaitTime: finiteNumber(msg?.totalWaitTime),
            waitingNodeCount: finiteNumber(msg?.waitingNodeCount),
            dayCount: finiteNumber(msg?.dayCount, dailyResources.length),
            dailyResources,
            tasks,
            planSnapshot,
            generatedAt: new Date().toISOString()
        };
    }

    async function saveSimulationSummaryRecord(summary) {
        if (!summary) return;

        if (!currentRunId && runRecordReadyPromise) {
            try { await runRecordReadyPromise; } catch (ignored) {}
        }
        if (!isDbOnline || !currentRunId) {
            appendEventLog('方案汇总未写入数据库：当前运行记录不可用', 'warn');
            return;
        }
        if (lastSummarySavedRunId === currentRunId) return;

        const runId = currentRunId;
        // 先占位，避免 printSummary() 与服务器结束汇总几乎同时到达时重复写入。
        lastSummarySavedRunId = runId;
        const summaryNodeId = '__SIM_SUMMARY__';
        const summaryNodeName = '__SIM_SUMMARY__';
        const compactDaily = (summary.dailyResources || [])
            .map(item => String(item.day) + ':' + finiteNumber(item.averageResources).toFixed(2))
            .join('|');
        const summaryDescription = [
            'scheme=' + encodeURIComponent(summary.schemeName || ''),
            'totalDuration=' + finiteNumber(summary.totalDuration),
            'averageResourceUsage=' + finiteNumber(summary.averageResourceUsage),
            'peakDailyResourceUsage=' + finiteNumber(summary.peakDailyResourceUsage),
            'totalPersonDays=' + finiteNumber(summary.totalPersonDays),
            'totalWaitTime=' + finiteNumber(summary.totalWaitTime),
            'waitingNodeCount=' + finiteNumber(summary.waitingNodeCount),
            'daily=' + compactDaily
        ].join(';');

        const properties = {
            recordType: 'SIMULATION_SUMMARY',
            schemeName: summary.schemeName,
            timeUnit: summary.timeUnit,
            durationUnit: summary.durationUnit,
            resourceUnit: summary.resourceUnit,
            totalOperators: summary.totalOperators,
            totalDuration: summary.totalDuration,
            completedNodes: summary.completedNodes,
            totalPersonDays: summary.totalPersonDays,
            averageResourceUsage: summary.averageResourceUsage,
            peakDailyResourceUsage: summary.peakDailyResourceUsage,
            totalWaitTime: summary.totalWaitTime,
            waitingNodeCount: summary.waitingNodeCount,
            dayCount: summary.dayCount,
            dailyResourcesJson: JSON.stringify(summary.dailyResources || []),
            tasksJson: JSON.stringify(summary.tasks || []),
            planSnapshotJson: JSON.stringify(summary.planSnapshot || []),
            generatedAt: summary.generatedAt
        };

        try {
            const readyParams = new URLSearchParams({
                runId,
                nodeId: summaryNodeId,
                nodeName: summaryNodeName,
                nodeType: 'SimulationSummary',
                requiredPeople: summary.totalOperators || 0,
                isStartNode: false,
                isEndNode: true,
                description: summaryDescription,
                stereotypeName: 'SimulationSummary'
            });
            await axios.post(
                `${API_BASE_URL}/simulationNode/record/ready?${readyParams.toString()}`,
                properties
            );

            await axios.post(
                `${API_BASE_URL}/simulationNode/record/start?${new URLSearchParams({ runId, nodeId: summaryNodeId }).toString()}`
            );

            const pseudoDurationMs = Math.round((summary.totalDuration || 0) * 1000);
            const finishProperties = {
                ...properties,
                _execDurationMs: pseudoDurationMs,
                _requiredPeople: summary.totalOperators || 0
            };
            await axios.post(
                `${API_BASE_URL}/simulationNode/record/finish?${new URLSearchParams({
                    runId,
                    nodeId: summaryNodeId,
                    execDurationMs: pseudoDurationMs
                }).toString()}`,
                finishProperties
            );

            const varsParams = new URLSearchParams({
                runId,
                nodeId: summaryNodeId,
                nodeName: summaryNodeName,
                isInitial: false,
                isFinal: true
            });
            await axios.post(
                `${API_BASE_URL}/simulationNode/record/vars?${varsParams.toString()}`,
                properties
            );

            appendEventLog(
                '方案“' + summary.schemeName + '”汇总已保存：总工期=' +
                finiteNumber(summary.totalDuration).toFixed(2) + ' 天',
                'info'
            );
        } catch (error) {
            if (lastSummarySavedRunId === runId) lastSummarySavedRunId = null;
            console.error('保存方案汇总失败:', error);
            appendEventLog('保存方案汇总失败: ' + error.message, 'error');
        }
    }

    function handleSimulationSummary(msg) {
        lastSimulationSummary = normalizeSimulationSummary(msg || {});
        appendEventLog(
            '方案汇总：' + lastSimulationSummary.schemeName +
            '，总工期=' + lastSimulationSummary.totalDuration.toFixed(2) + ' 天' +
            '，平均资源=' + lastSimulationSummary.averageResourceUsage.toFixed(2),
            'info'
        );
        // 串行保存，避免极短仿真时 summary 比 simulationRun/start 的 HTTP 返回更早，
        // 也避免 printSummary() 与服务器自动汇总同时到达时覆盖正在执行的 Promise。
        const summaryToSave = lastSimulationSummary;
        summarySavePromise = Promise.resolve(summarySavePromise)
            .then(() => saveSimulationSummaryRecord(summaryToSave));
    }

    function showNotification(msg, isError = false) {
        const div = document.createElement('div');
        div.className = 'notification';
        div.textContent = msg;
        if (isError) div.style.backgroundColor = '#cc0000';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2800);
    }

    function getMinActiveMs() { return BASE_MIN_ACTIVE_MS / simSpeed; }
    function getParticleDuration() { return BASE_PARTICLE_DURATION / simSpeed; }

    function calculateBounds() {
        if (!currentData) return { minX: 0, minY: 0, width: 1000, height: 700 };

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        let hasValidNode = false;
        let hasValidEdge = false;

        // ★★★ 先检查所有节点 ★★★
        currentData.nodes.forEach(n => {
            // 跳过没有有效坐标的节点
            if (n.x === undefined || n.y === undefined || n.w === undefined || n.h === undefined) return;
            if (isNaN(n.x) || isNaN(n.y) || isNaN(n.w) || isNaN(n.h)) return;
            // 跳过尺寸为0或负数的节点（可能是无效数据）
            if (n.w <= 0 || n.h <= 0) return;
            // 跳过位置异常大的节点（可能是错误数据）
            if (Math.abs(n.x) > 1e8 || Math.abs(n.y) > 1e8) return;

            hasValidNode = true;
            minX = Math.min(minX, n.x);
            minY = Math.min(minY, n.y);
            maxX = Math.max(maxX, n.x + n.w);
            maxY = Math.max(maxY, n.y + n.h);
        });

        // ★★★ 再检查所有连线的点 ★★★
        if (currentData.edges) {
            currentData.edges.forEach(e => {
                if (!e.points || e.points.length === 0) return;
                e.points.forEach(p => {
                    if (!p || p.length < 2) return;
                    const x = p[0];
                    const y = p[1];
                    if (isNaN(x) || isNaN(y)) return;
                    if (Math.abs(x) > 1e8 || Math.abs(y) > 1e8) return;
                    hasValidEdge = true;
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x);
                    maxY = Math.max(maxY, y);
                });
            });
        }

        // ★★★ 如果没有有效数据，返回默认值 ★★★
        if (!hasValidNode && !hasValidEdge) {
            console.warn('[calculateBounds] 没有有效节点或连线，使用默认边界');
            return { minX: 0, minY: 0, width: 1000, height: 700 };
        }

        // ★★★ 如果只有节点但没有有效边界，使用默认值 ★★★
        if (!isFinite(minX) || !isFinite(minY) || !isFinite(maxX) || !isFinite(maxY)) {
            console.warn('[calculateBounds] 边界值异常，使用默认边界');
            return { minX: 0, minY: 0, width: 1000, height: 700 };
        }

        // ★★★ 如果边界范围太小，扩展一些 ★★★
        const width = maxX - minX;
        const height = maxY - minY;
        if (width < 10 || height < 10) {
            const pad = 100;
            return { minX: minX - pad, minY: minY - pad, width: width + pad * 2, height: height + pad * 2 };
        }

        const pad = 90;
        return { minX: minX - pad, minY: minY - pad, width: width + pad * 2, height: height + pad * 2 };
    }

    function allEls(id) {
        return zoomGroup ? [...zoomGroup.querySelectorAll(`[data-id="${id}"]`)] : [];
    }

    function setSimClass(id, add, remove) {
        allEls(id).forEach(el => {
            remove.forEach(c => el.classList.remove(c));
            if (add) el.classList.add(add);
        });
    }

    function wsReady() { return isConnected && ws && ws.readyState === WebSocket.OPEN; }

    // ========================= Trigger相关函数 =========================
    function loadStateMachineTriggers() {
        if (!wsReady()) {
            showNotification('未连接MagicDraw插件', true);
            return;
        }
        const diagramId = getUrlParam('diagramId') || '';
        const container = document.getElementById('triggerContainer');
        if (container) {
            container.innerHTML = '<span class="trigger-loading">⏳ 加载中...</span>';
        }
        ws.send(JSON.stringify({
            command: 'get_state_machine_triggers',
            diagramId: diagramId
        }));
    }

    function handleStateMachineTriggers(msg) {
        const triggers = msg.triggers || [];
        const stateBehaviors = msg.stateBehaviors || {};
        const container = document.getElementById('triggerContainer');
        const stateMachineName = msg.stateMachineName || '未命名状态机';

        triggerList = triggers;
        if (!container) return;

        let html = '';
        let totalTriggers = triggers.length;

        let behaviorCount = 0;
        let behaviorEntries = [];
        Object.entries(stateBehaviors).forEach(([stateName, behaviors]) => {
            behaviors.forEach(behavior => {
                behaviorCount++;
                let type = 'execute';
                let cleanName = behavior;
                if (behavior.startsWith('🔵')) { type = 'entry'; cleanName = behavior.replace(/^🔵\s*进入:\s*/, ''); }
                else if (behavior.startsWith('🟢')) { type = 'do'; cleanName = behavior.replace(/^🟢\s*执行:\s*/, ''); }
                else if (behavior.startsWith('🔴')) { type = 'exit'; cleanName = behavior.replace(/^🔴\s*退出:\s*/, ''); }
                behaviorEntries.push({ stateName, type, display: behavior, cleanName });
            });
        });

        html += `
            <span style="font-size:10px;color:#94a3b8;margin-right:4px;flex-shrink:0;">
                 ${escapeHtml(stateMachineName)}
                <span class="trigger-badge">信号: ${totalTriggers}</span>
                <span class="trigger-badge" style="background:#f0f0e8;color:#8a7a4a;">行为: ${behaviorCount}</span>
            </span>
        `;

        if (totalTriggers > 0) {
            html += `<div style="width:100%;font-size:9px;color:#94a3b8;margin-top:4px;border-top:1px dashed #eef3fa;padding-top:4px;">转换触发 (Signal):</div>`;
            html += `<div style="display:flex;flex-wrap:wrap;gap:4px;width:100%;">`;
            triggers.forEach(signal => {
                const escaped = escapeHtml(signal);
                html += `
                    <button class="trigger-btn signal" data-signal="${escaped}"
                            onclick="sendTrigger('${escaped}')"
                            title="发送信号: ${escaped}"
                            style="font-size:11px;padding:3px 10px;">
                         ${escaped}
                    </button>
                `;
            });
            html += `</div>`;
        }

        if (behaviorEntries.length > 0) {
            html += `<div style="width:100%;font-size:9px;color:#94a3b8;margin-top:4px;border-top:1px dashed #eef3fa;padding-top:4px;"> 状态行为:</div>`;
            let currentState = '';
            behaviorEntries.forEach(({ stateName, type, display, cleanName }) => {
                if (stateName !== currentState) {
                    currentState = stateName;
                    html += `<div style="width:100%;font-size:10px;color:#4a5e7a;font-weight:500;margin-top:3px;">📦 ${escapeHtml(stateName)}</div>`;
                }
                let cls = 'do';
                let emoji = '🟢';
                if (type === 'entry') { cls = 'entry'; emoji = '🔵'; }
                else if (type === 'do') { cls = 'do'; emoji = '🟢'; }
                else if (type === 'exit') { cls = 'exit'; emoji = '🔴'; }
                const escapedClean = escapeHtml(cleanName);
                html += `
                    <button class="trigger-btn ${cls}"
                            onclick="sendTrigger('${escapedClean}')"
                            title="${escapeHtml(display)}"
                            style="font-size:11px;padding:3px 10px;">
                        ${emoji} ${escapedClean}
                    </button>
                `;
            });
        }

        if (totalTriggers === 0 && behaviorCount === 0) {
            html += `<span class="trigger-empty">🔕 未发现Trigger信号或状态行为</span>`;
        }

        container.innerHTML = html;
        appendEventLog('已加载 ' + totalTriggers + ' 个Trigger信号, ' + behaviorCount + ' 个状态行为', 'info');

        if (totalTriggers > 0 || behaviorCount > 0) {
            showNotification('已加载 ' + totalTriggers + ' 个信号, ' + behaviorCount + ' 个行为');
        }
    }

    function sendTrigger(signalName) {
        if (!wsReady()) {
            showNotification('请先连接MagicDraw插件', true);
            return;
        }
        ws.send(JSON.stringify({
            command: 'send_signal',
            signalName: signalName
        }));

        const container = document.getElementById('triggerContainer');
        if (container) {
            const buttons = container.querySelectorAll('.trigger-btn');
            buttons.forEach(btn => {
                btn.classList.remove('sent');
                if (btn.textContent.includes(signalName) || btn.dataset.signal === signalName) {
                    btn.classList.add('sent');
                    setTimeout(() => btn.classList.remove('sent'), 2000);
                }
            });
        }

        showNotification('📡 信号已发送: ' + signalName);
        appendEventLog('发送信号: ' + signalName, 'info');
    }

    // ========================= 节点配置缓存 =========================
    function normalizeTaskName(name) {
        return String(name || '').replace(/\s+/g, ' ').trim();
    }

    function putNodeConfig(taskName, config) {
        if (!taskName || !config) return;
        const rawName = String(taskName);
        nodeConfigCache.set(rawName, config);
        nodeFullConfigCache.set(rawName, config);
    }

    function getCachedNodeConfig(taskName) {
        const rawName = String(taskName || '');
        const normalizedName = normalizeTaskName(rawName);
        if (!normalizedName) return null;

        if (nodeFullConfigCache.has(rawName)) return nodeFullConfigCache.get(rawName);
        if (nodeConfigCache.has(rawName)) return nodeConfigCache.get(rawName);

        for (const [name, config] of nodeFullConfigCache.entries()) {
            if (normalizeTaskName(name) === normalizedName) return config;
        }
        for (const [name, config] of nodeConfigCache.entries()) {
            if (normalizeTaskName(name) === normalizedName) return config;
        }
        return null;
    }

    function extractConfigProperties(config) {
        const props = {};
        if (!config || typeof config !== 'object') return props;
        if (config.allProperties && typeof config.allProperties === 'object') {
            Object.assign(props, config.allProperties);
        }
        if (props.requiredPeople === undefined && config.requiredPeople !== undefined) {
            props.requiredPeople = config.requiredPeople;
        }
        if (props.duration === undefined && config.duration !== undefined) {
            props.duration = config.duration;
        }
        return props;
    }

    function cacheAllNodeConfigs(configs) {
        let validCount = 0;
        Object.entries(configs || {}).forEach(([name, config]) => {
            if (config && !config.error) {
                putNodeConfig(name, config);
                validCount++;
            }
        });
        return validCount;
    }

    function ensureAllNodeConfigsLoaded(forceReload = false) {
        if (!wsReady()) return Promise.reject(new Error('WebSocket 尚未连接'));
        if (allNodeConfigsLoaded && !forceReload) {
            return Promise.resolve({
                configs: Object.fromEntries(nodeFullConfigCache.entries()),
                count: nodeFullConfigCache.size
            });
        }
        if (allNodeConfigsLoadingPromise && !forceReload) return allNodeConfigsLoadingPromise;

        allNodeConfigsLoadingPromise = new Promise((resolve, reject) => {
            const callbackId = 'preload_all_configs_' + Date.now();
            const timeoutId = setTimeout(() => {
                delete window._configCallbacks[callbackId];
                allNodeConfigsLoadingPromise = null;
                reject(new Error('读取 ResourceTask 配置超时'));
            }, 10000);

            window._configCallbacks[callbackId] = (msg) => {
                clearTimeout(timeoutId);
                try {
                    const configs = msg && msg.configs ? msg.configs : {};
                    const count = cacheAllNodeConfigs(configs);
                    allNodeConfigsLoaded = true;
                    resolve({ ...msg, configs, count });
                } catch (error) {
                    reject(error);
                } finally {
                    allNodeConfigsLoadingPromise = null;
                }
            };

            ws.send(JSON.stringify({
                command: 'get_all_node_configs',
                _callbackId: callbackId
            }));
        });

        return allNodeConfigsLoadingPromise;
    }

    function requestNodeVariables(node) {
        if (!node || !wsReady()) return;
        ws.send(JSON.stringify({
            command: 'get_node_variables',
            nodeId: node.id || '',
            nodeName: node.name || ''
        }));
    }

    function refreshSelectedNodeVariablesPanel() {
        const node = currentData?.nodes?.find(n => n.id === selectedNodeId);
        const merged = {};
        if (node) {
            Object.assign(merged, collectNodeVariables(node));
            delete merged._nodeId;
            delete merged._nodeType;
            delete merged._timestamp;
            delete merged._finishedAt;
            delete merged._execDurationMs;
            delete merged._requiredPeople;
        }
        Object.assign(merged, latestRuntimeValues || {});
        updateRuntimeValues(merged);
    }

    // ========================= 节点激活 =========================
    function activateNode(nodeId) {
        if (!nodeId) return;

        activeNodes.add(nodeId);

        if (deactivateTimers.has(nodeId)) {
            clearTimeout(deactivateTimers.get(nodeId));
            deactivateTimers.delete(nodeId);
        }

        // 当前图中存在该节点时才改 DOM。
        // 如果此时正在查看子流程，而事件属于父流程，状态仍然保存在 activeNodes 中，
        // 返回父流程后由 restoreSimulationState() 恢复。
        if (zoomGroup) {
            if (isStateMachineDiagram) {
                setStateClass(nodeId, 'state-active', ['state-done', 'sim-active']);
            } else {
                setSimClass(nodeId, 'sim-active', ['node-done']);
            }
        }

        const diagramData = findLoadedDiagramContainingNode(nodeId) || currentData;
        const node = diagramData?.nodes?.find(n => n.id === nodeId) || null;

        if (isRecording && currentRunId && node) {
            recordNodeStart(currentRunId, nodeId);
            const nodeVars = collectNodeVariables(node);
            if (nodeVars && Object.keys(nodeVars).length > 0) {
                recordNodeVars(currentRunId, nodeId, node.name || '', nodeVars, true, false);
            }
        }

        // 使用“节点真正所属的图”查找入边，避免已经进入子流程后仍拿 currentData（子流程）
        // 去处理父流程节点的连线。
        if (diagramData && !isStateMachineDiagram) {
            (diagramData.edges || []).forEach(edge => {
                if (edge.targetId !== nodeId) return;

                // 如果当前画布正好显示这条边，就立即变红；否则只保留状态，返回该图时恢复。
                const pathEl = zoomGroup?.querySelector(`.uml-edge[data-id="${edge.id}"]`);
                if (!pathEl) return;

                pathEl.classList.remove('edge-done');
                pathEl.classList.add('edge-active');

                if (particleHandles.has(edge.id)) {
                    particleHandles.get(edge.id).cancel();
                }
                particleHandles.set(edge.id, spawnParticle(pathEl, '#cc0000'));
            });
        }

        updatePanelIfSelected(nodeId, true);
    }

    function setStateClass(id, add, remove) {
        allEls(id).forEach(el => {
            remove.forEach(c => el.classList.remove(c));
            if (add) el.classList.add(add);
        });
        const g = zoomGroup?.querySelector(`[data-node-grp="${id}"]`);
        if (g) {
            remove.forEach(c => g.classList.remove(c));
            if (add) g.classList.add(add);
        }
    }

    function collectNodeVariables(node) {
        if (!node) return {};
        const vars = {};
        if (node.variables && typeof node.variables === 'object') {
            Object.assign(vars, node.variables);
        }
        const config = getCachedNodeConfig(node.name);
        const allProps = extractConfigProperties(config);
        Object.keys(allProps).forEach(key => {
            vars[key] = allProps[key];
        });
        const normalizedName = normalizeTaskName(node.name);
        let stats = nodeStatsCache[node.name] || nodeStatsCache[normalizedName] || null;
        if (!stats && normalizedName) {
            Object.keys(nodeStatsCache).some(name => {
                if (normalizeTaskName(name) === normalizedName) {
                    stats = nodeStatsCache[name];
                    return true;
                }
                return false;
            });
        }
        if (stats) {
            if (vars.requiredPeople === undefined && stats.requiredPeople !== undefined) {
                vars.requiredPeople = stats.requiredPeople;
            }
            if (vars.duration === undefined && stats.duration !== undefined) {
                vars.duration = stats.duration;
            }

            // 仿真业务时间（单位：天）。这些字段用于历史方案恢复与对比，
            // 和数据库里的电脑实际时间戳/毫秒字段严格区分。
            if (stats.readyTime !== undefined) vars._simReadyDay = stats.readyTime;
            if (stats.startTime !== undefined) vars._simStartDay = stats.startTime;
            if (stats.finishTime !== undefined) vars._simFinishDay = stats.finishTime;
            if (stats.waitTime !== undefined) vars._simWaitDays = stats.waitTime;
            if (stats.totalTime !== undefined) vars._simTotalDays = stats.totalTime;
            if (stats.duration !== undefined) vars._durationDays = stats.duration;
            if (stats.requiredPeople !== undefined) vars._requiredPeople = stats.requiredPeople;
            vars._simTimeUnit = 'day';
        }
        vars._nodeId = node.id;
        vars._nodeType = node.type;
        vars._timestamp = new Date().toISOString();
        return vars;
    }

    function deactivateNode(nodeId) {
        if (!nodeId) return;

        // 在收到 deactivate 的这一刻就锁定节点真正所属的图。
        // 这样即使 getMinActiveMs() 延迟期间用户进入了子流程，
        // 定时器触发时也不会错误地拿子流程 currentData 去处理父流程节点。
        const diagramDataAtEvent = findLoadedDiagramContainingNode(nodeId) || currentData;
        const nodeAtEvent = diagramDataAtEvent?.nodes?.find(n => n.id === nodeId) || null;
        const incomingEdgesAtEvent = (diagramDataAtEvent?.edges || [])
            .filter(edge => edge.targetId === nodeId)
            .map(edge => ({ ...edge }));

        if (deactivateTimers.has(nodeId)) {
            clearTimeout(deactivateTimers.get(nodeId));
        }

        const timer = setTimeout(() => {
            deactivateTimers.delete(nodeId);
            activeNodes.delete(nodeId);
            visitedNodes.add(nodeId);

            // 当前画布上存在该节点才立即改颜色；不在当前图中也没关系，
            // visitedNodes 已保存，返回该图后 restoreSimulationState() 会恢复绿色。
            if (zoomGroup) {
                if (isStateMachineDiagram) {
                    setStateClass(nodeId, 'state-done', ['state-active', 'sim-active']);
                } else {
                    setSimClass(nodeId, 'node-done', ['sim-active']);
                }
            }

            if (isRecording && currentRunId) {
                const node = nodeAtEvent || findLoadedNode(nodeId);
                let durationMs = null;
                let requiredPeople = null;
                let finalVars = null;

                if (node && node.name) {
                    const config = getCachedNodeConfig(node.name);
                    const configProperties = extractConfigProperties(config);
                    const duration = configProperties.duration;
                    const people = configProperties.requiredPeople;

                    if (duration !== undefined && duration !== null && duration !== '') {
                        const durationNumber = Number(duration);
                        durationMs = Number.isFinite(durationNumber)
                            ? Math.round(durationNumber * 1000)
                            : null;
                    }

                    if (people !== undefined && people !== null && people !== '') {
                        const peopleNumber = Number(people);
                        requiredPeople = Number.isFinite(peopleNumber) ? peopleNumber : null;
                    }

                    finalVars = collectNodeVariables(node);
                    finalVars._execDurationMs = durationMs;
                    finalVars._durationDays = Number.isFinite(Number(duration)) ? Number(duration) : 0;
                    finalVars._requiredPeople = requiredPeople;
                    finalVars._simTimeUnit = 'day';
                    finalVars._finishedAt = new Date().toISOString();
                }

                recordNodeFinishWithVars(currentRunId, nodeId, durationMs, requiredPeople, finalVars);

                if (node && finalVars && Object.keys(finalVars).length > 0) {
                    recordNodeVars(
                        currentRunId,
                        nodeId,
                        node.name || '',
                        finalVars,
                        false,
                        true
                    );
                }
            }

            // 入边是否走过属于“仿真状态”，与当前画布正在显示哪一层无关。
            incomingEdgesAtEvent.forEach(edge => {
                visitedEdges.add(edge.id);

                if (particleHandles.has(edge.id)) {
                    particleHandles.get(edge.id).cancel();
                    particleHandles.delete(edge.id);
                }

                const pathEl = zoomGroup?.querySelector(`.uml-edge[data-id="${edge.id}"]`);
                if (pathEl) {
                    pathEl.classList.remove('edge-active');
                    pathEl.classList.add('edge-done');
                }
            });

            updatePanelIfSelected(nodeId, false);
        }, getMinActiveMs());

        deactivateTimers.set(nodeId, timer);
    }

    function spawnParticle(pathEl, color) {
        if (!pathEl || !zoomGroup) return { cancel: () => {} };
        let alive = true;
        let dot = null;
        dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('r', PARTICLE_RADIUS);
        dot.setAttribute('fill', color);
        dot.setAttribute('class', 'flow-particle');
        dot.style.filter = `drop-shadow(0 0 3px ${color})`;
        zoomGroup.appendChild(dot);

        const len = pathEl.getTotalLength();
        const t0 = performance.now();

        (function step(now) {
            if (!alive) { if (dot) dot.remove(); return; }
            let t = Math.min((now - t0) / getParticleDuration(), 1);
            const ease = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            const pt = pathEl.getPointAtLength(ease * len);
            dot.setAttribute('cx', pt.x);
            dot.setAttribute('cy', pt.y);
            dot.setAttribute('opacity', .4 + .6 * Math.sin(t * Math.PI));
            if (t < 1) {
                requestAnimationFrame(step);
            } else {
                if (dot) dot.remove();
            }
        })(performance.now());

        return { cancel() { alive = false; if (dot) dot.remove(); } };
    }

    function clearAllActiveStates() {
        deactivateTimers.forEach(clearTimeout);
        deactivateTimers.clear();
        particleHandles.forEach(h => h.cancel());
        particleHandles.clear();

        if (zoomGroup) {
            zoomGroup.querySelectorAll('.sim-active,.node-done,.state-active,.state-done').forEach(e => {
                e.classList.remove('sim-active', 'node-done', 'state-active', 'state-done');
            });
            zoomGroup.querySelectorAll('.edge-active,.edge-done').forEach(e => {
                e.classList.remove('edge-active', 'edge-done');
            });
            zoomGroup.querySelectorAll('[data-node-grp]').forEach(g => {
                g.classList.remove('state-active', 'state-done', 'sim-active', 'node-done');
            });
        }

        activeNodes.clear();
        visitedNodes.clear();
        visitedEdges.clear();
    }

    /**
     * 返回当前已经加载到前端内存中的所有图数据。
     * navigationStack 保存父流程快照，currentData 是当前正在看的图。
     */
    function getLoadedDiagramDataList() {
        const result = [];
        const seen = new Set();

        const push = data => {
            if (!data || !Array.isArray(data.nodes)) return;
            const key = data;
            if (seen.has(key)) return;
            seen.add(key);
            result.push(data);
        };

        push(currentData);
        navigationStack.forEach(item => push(item?.data));

        return result;
    }

    function findLoadedDiagramContainingNode(nodeId) {
        if (!nodeId) return null;

        const loaded = getLoadedDiagramDataList();
        for (const data of loaded) {
            if ((data.nodes || []).some(node => node.id === nodeId)) {
                return data;
            }
        }
        return null;
    }

    function findLoadedNode(nodeId) {
        const data = findLoadedDiagramContainingNode(nodeId);
        return data?.nodes?.find(node => node.id === nodeId) || null;
    }

    /**
     * SVG 每次 initSVG() 都会被整个重建。
     * 所以进入子流程、返回父流程、返回主图、重新应用图数据之后，
     * 必须根据内存中的仿真状态重新给新 DOM 加上红/绿色。
     */
    function restoreSimulationState() {
        if (!zoomGroup || !currentData || !Array.isArray(currentData.nodes)) return;

        const currentNodeIds = new Set(
            currentData.nodes
                .filter(Boolean)
                .map(node => node.id)
                .filter(Boolean)
        );

        // 已完成节点：绿色
        visitedNodes.forEach(nodeId => {
            if (!currentNodeIds.has(nodeId)) return;

            if (isStateMachineDiagram) {
                setStateClass(nodeId, 'state-done', ['state-active', 'sim-active']);
            } else {
                setSimClass(nodeId, 'node-done', ['sim-active']);
            }
        });

        // 当前执行节点：红色，优先级高于已完成
        activeNodes.forEach(nodeId => {
            if (!currentNodeIds.has(nodeId)) return;

            if (isStateMachineDiagram) {
                setStateClass(nodeId, 'state-active', ['state-done', 'sim-active']);
            } else {
                setSimClass(nodeId, 'sim-active', ['node-done']);
            }
        });

        if (!isStateMachineDiagram) {
            (currentData.edges || []).forEach(edge => {
                if (!edge || !edge.id) return;

                const pathEl = zoomGroup.querySelector(`.uml-edge[data-id="${edge.id}"]`);
                if (!pathEl) return;

                pathEl.classList.remove('edge-active', 'edge-done');

                // visitedEdges 是最准确的记录。
                // 同时用 target 已完成作为兜底，解决切换子流程期间 deactivate 定时器
                // 已执行但边 DOM 当时不在当前画布上的情况。
                if (visitedEdges.has(edge.id) || visitedNodes.has(edge.targetId)) {
                    pathEl.classList.add('edge-done');
                    return;
                }

                if (activeNodes.has(edge.targetId)) {
                    pathEl.classList.add('edge-active');
                }
            });
        }
    }

    /**
     * 仿真结束时只结束“当前红色”状态，不删除本轮已经完成的绿色路径。
     * 真正清空上一轮状态只发生在下一次 sim_start。
     */
    function clearTransientActiveStates() {
        deactivateTimers.forEach(clearTimeout);
        deactivateTimers.clear();

        particleHandles.forEach(h => h.cancel());
        particleHandles.clear();

        const finishingNodeIds = Array.from(activeNodes);

        finishingNodeIds.forEach(nodeId => {
            activeNodes.delete(nodeId);
            visitedNodes.add(nodeId);

            const diagramData = findLoadedDiagramContainingNode(nodeId);
            (diagramData?.edges || []).forEach(edge => {
                if (edge.targetId === nodeId && edge.id) {
                    visitedEdges.add(edge.id);
                }
            });
        });

        restoreSimulationState();
    }

    function updatePanelIfSelected(nodeId, isActive) {
        if (!zoomGroup?.querySelector(`[data-id="${nodeId}"][data-selected="true"]`) || !currentData) return;
        const node = currentData.nodes.find(n => n.id === nodeId);
        if (node) showNodePanel(node, isActive);
    }

    // ========================= SVG 初始化 =========================
    async function loadJSON() {
        diagramId = getUrlParam('diagramId') || '';
        diagramName = getUrlParam('name') || '未命名流程';
        document.getElementById('diagramTitle').textContent = diagramName;
        checkDbConnection();
        if (diagramId) {
            document.getElementById('loadingMsg').textContent = '正在从 MagicDraw 获取流程图 ...';
            connectWS();
            return;
        }
        const jsonFile = getUrlParam('file') || 'model1.json';
        try {
            const resp = await fetch(jsonFile);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            currentData = await resp.json();
            if (currentData.nodes) currentData.nodes = currentData.nodes.filter(n => n.type !== 'DiagramImpl');
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('diagramSvg').style.display = 'block';
            initSVG();
            renderDiagram();
        } catch (err) {
            document.getElementById('loadingMsg').innerHTML =
                `<div style="color:#cc0000;">加载失败: ${escapeHtml(err.message)}</div>
                     <button onclick="goBack()" style="margin-top:14px;padding:6px 20px;border-radius:4px;border:none;background:#f1f5f9;cursor:pointer;">返回</button>`;
        }
    }

    function initSVG() {
        const svgEl = document.getElementById('diagramSvg');
        svgEl.innerHTML = '';

        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        defs.innerHTML = `
        <marker id="arr"   markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr-a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M1,1 L9,5 L1,9" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr-d" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M1,1 L9,5 L1,9" fill="none" stroke="#2d7a2d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>`;
        svgEl.appendChild(defs);

        const b = calculateBounds();

        // ★★★ 确保边界值有效 ★★★
        if (!isFinite(b.width) || !isFinite(b.height) || b.width <= 0 || b.height <= 0) {
            console.warn('[initSVG] 边界值异常，使用默认值', b);
            b.minX = 0;
            b.minY = 0;
            b.width = 1000;
            b.height = 700;
        }

        svgEl.setAttribute('width', b.width);
        svgEl.setAttribute('height', b.height);
        svgEl.setAttribute('viewBox', `${b.minX} ${b.minY} ${b.width} ${b.height}`);

        zoomGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        svgEl.appendChild(zoomGroup);

        zoomBehavior = d3.zoom().scaleExtent([.1, 6]).on('zoom', ev => {
            currentZoom = ev.transform.k;
            document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
            d3.select(zoomGroup).attr('transform', ev.transform);
        });
        d3.select(svgEl).call(zoomBehavior);
    }

    function detectDiagramType(data) {
        if (!data || !data.nodes || !data.edges) return false;
        let stateCount = 0, transitionCount = 0;
        data.nodes.forEach(node => {
            if (node.type && (node.type.includes('State') || node.type.includes('Pseudostate'))) {
                stateCount++;
            }
        });
        data.edges.forEach(edge => {
            if (edge.type && (edge.type.includes('Transition') || edge.type.includes('ControlFlow'))) {
                transitionCount++;
            }
        });
        return stateCount > 0 && transitionCount > 0;
    }

    // ========================= 标签渲染 - 修改：过滤 "action" =========================
    function addLabel(g, text, cx, cy, maxW, maxH) {
        // ★★★ 如果文本为空或为 "action"，不渲染 ★★★
        if (!text || text.trim() === '' || text.trim() === 'action') return;

        const fontSize = 11;
        const lineHeight = 12;

        function getCharWidth(ch) {
            const code = ch.charCodeAt(0);
            if ((code >= 0x4E00 && code <= 0x9FFF) ||
                (code >= 0x3400 && code <= 0x4DBF) ||
                (code >= 0x20000 && code <= 0x2A6DF) ||
                (code >= 0x2F800 && code <= 0x2FA1F) ||
                (code >= 0xF900 && code <= 0xFAFF)) {
                return fontSize * 0.95;
            }
            if (ch === '，' || ch === '。' || ch === '、' || ch === '；' || ch === '：' ||
                ch === '！' || ch === '？' || ch === '“' || ch === '”' || ch === '‘' || ch === '’' ||
                ch === '（' || ch === '）' || ch === '【' || ch === '】' || ch === '《' || ch === '》' ||
                ch === '—' || ch === '…' || ch === '·' || ch === '、') {
                return fontSize * 0.8;
            }
            return fontSize * 0.55;
        }

        function getTextWidth(str) {
            let total = 0;
            for (const ch of str) {
                total += getCharWidth(ch);
            }
            return total;
        }

        const maxWidth = maxW - 8;
        const lines = [];
        let currentLine = '';

        for (const ch of text) {
            const testLine = currentLine + ch;
            const testWidth = getTextWidth(testLine);

            if (testWidth > maxWidth) {
                if (currentLine.length > 0) {
                    lines.push(currentLine);
                    currentLine = ch;
                } else {
                    lines.push(ch);
                    currentLine = '';
                }
            } else {
                currentLine = testLine;
            }
        }
        if (currentLine.length > 0) {
            lines.push(currentLine);
        }

        if (lines.length === 0) return;

        const maxLines = Math.max(1, Math.floor((maxH - 6) / lineHeight));

        let displayLines = lines;
        if (lines.length > maxLines) {
            displayLines = lines.slice(0, maxLines);
            const lastLine = displayLines[displayLines.length - 1];
            const ellipsis = '…';
            let truncated = lastLine;
            while (getTextWidth(truncated + ellipsis) > maxWidth && truncated.length > 0) {
                truncated = truncated.slice(0, -1);
            }
            if (truncated.length > 0) {
                displayLines[displayLines.length - 1] = truncated + ellipsis;
            } else {
                displayLines[displayLines.length - 1] = ellipsis;
            }
        }

        const totalTextHeight = displayLines.length * lineHeight;
        const textTop = cy - totalTextHeight / 2 + 2;

        displayLines.forEach((ln, i) => {
            const t = svgEl('text');
            t.setAttribute('x', cx);
            t.setAttribute('y', textTop + i * lineHeight + lineHeight * 0.75);
            t.setAttribute('class', 'node-lbl');
            t.setAttribute('font-size', fontSize);
            t.setAttribute('font-family', 'Arial, sans-serif');
            t.setAttribute('fill', '#1a1a1a');
            t.setAttribute('text-anchor', 'middle');
            t.setAttribute('dominant-baseline', 'auto');
            t.textContent = ln;
            g.appendChild(t);
        });
    }

    // ========================= 泳道绘制 ★★★ =========================
    function drawSwimlane(node) {

            id: node.id,
            name: node.name,
            represents: node.represents,
            type: node.type,

        const g = svgEl('g');

        g.classList.add('swimlane-clickable');

        const isVertical = node.orientation === 'vertical';

        // 与 MagicDraw 的两行泳道标题更接近：

        const titleHeight = 38;

        // ===== 泳道边框：标题框 + 左右边框，底部开放 =====
        const topRect = svgEl('rect');
        topRect.setAttribute('x', node.x);
        topRect.setAttribute('y', node.y);
        topRect.setAttribute('width', node.w);

        topRect.setAttribute('fill', '#f5f6f8');
        topRect.setAttribute('stroke', '#000000');
        topRect.setAttribute('stroke-width', '1.5');
        topRect.setAttribute('data-id', node.id);
        topRect.setAttribute('class', 'swimlane-top');
        g.appendChild(topRect);

        const leftLine = svgEl('line');
        leftLine.setAttribute('x1', node.x);
        leftLine.setAttribute('y1', node.y + titleHeight);
        leftLine.setAttribute('x2', node.x);
        leftLine.setAttribute('y2', node.y + node.h);
        leftLine.setAttribute('stroke', '#000000');
        leftLine.setAttribute('stroke-width', '1.5');
        leftLine.setAttribute('class', 'swimlane-left');

        const rightLine = svgEl('line');
        rightLine.setAttribute('x1', node.x + node.w);
        rightLine.setAttribute('y1', node.y + titleHeight);
        rightLine.setAttribute('x2', node.x + node.w);
        rightLine.setAttribute('y2', node.y + node.h);
        rightLine.setAttribute('stroke', '#000000');
        rightLine.setAttribute('stroke-width', '1.5');
        rightLine.setAttribute('class', 'swimlane-right');
        g.appendChild(rightLine);

        // ===== 泳道标题：完全按 MagicDraw 的上下两行结构 =====
        const displayName = node.name || node.represents || '未命名泳道';
        const titleX = isVertical ? (node.x + node.w / 2) : (node.x + 10);
        const anchor = isVertical ? 'middle' : 'start';

        const title = svgEl('text');
        title.setAttribute('class', 'swimlane-title');
        title.setAttribute('font-family', 'Arial, sans-serif');
        title.setAttribute('text-anchor', anchor);

        // 第一行：«allocate»
        const allocSpan = svgEl('tspan');
        allocSpan.setAttribute('x', titleX);
        allocSpan.setAttribute('y', node.y + 12);
        allocSpan.setAttribute('font-size', '11');
        allocSpan.setAttribute('font-weight', '600');
        allocSpan.setAttribute('fill', '#000000');
        allocSpan.setAttribute('font-style', 'normal');
        allocSpan.setAttribute('text-anchor', anchor);
        allocSpan.textContent = '«allocate»';
        title.appendChild(allocSpan);

        // 第二行：泳道名称
        const nameSpan = svgEl('tspan');
        nameSpan.setAttribute('x', titleX);
        nameSpan.setAttribute('y', node.y + 29);
        nameSpan.setAttribute('font-size', '12');
        nameSpan.setAttribute('font-weight', '600');
        nameSpan.setAttribute('fill', '#000000');
        nameSpan.setAttribute('font-style', 'normal');
        nameSpan.setAttribute('text-anchor', anchor);
        nameSpan.textContent = displayName;
        title.appendChild(nameSpan);

        // Represents 已经用于确定 node.name，标题中不再额外画 “↳ Represents”。

        g.appendChild(title);

            topRect.setAttribute('stroke-width', '2.5');
