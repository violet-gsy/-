    function svgEl(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

    // ========================= 活动图节点绘制 - 修改：显示节点名+子流程名 =========================
    function drawNode(node) {
        const { x, y, w, h, id } = node;
        const style = getNodeStyle(node.type);
        const name = node.name || (style.label || style.shape);

        const g = svgEl('g');
        g.setAttribute('data-node-grp', id);
        g.setAttribute('data-selected', 'false');
        g.style.cursor = 'pointer';

        g.addEventListener('click', ev => {
            ev.stopPropagation();
            selectNode(node);
        });

        g.addEventListener('dblclick', ev => {
            ev.stopPropagation();
            checkAndOpenSubprocess(node);
        });

        switch (style.shape) {
            case 'initial': {
                const r = Math.min(w, h) / 2;
                const c = svgEl('circle');
                c.setAttribute('cx', x + w / 2);
                c.setAttribute('cy', y + h / 2);
                c.setAttribute('r', r);
                c.setAttribute('class', 'uml-initial');
                c.setAttribute('data-id', id);
                g.appendChild(c);
                break;
            }
            case 'final': {
                const r = Math.min(w, h) / 2, cx = x + w / 2, cy = y + h / 2;
                const ring = svgEl('circle');
                ring.setAttribute('cx', cx);
                ring.setAttribute('cy', cy);
                ring.setAttribute('r', r);
                ring.setAttribute('class', 'uml-final-ring');
                ring.setAttribute('data-id', id);
                g.appendChild(ring);
                const dot = svgEl('circle');
                dot.setAttribute('cx', cx);
                dot.setAttribute('cy', cy);
                dot.setAttribute('r', r * .55);
                dot.setAttribute('class', 'uml-final-dot');
                dot.setAttribute('data-id', id);
                g.appendChild(dot);
                break;
            }
            case 'bar': {
                const barH = Math.max(h, 8);
                const rect = svgEl('rect');
                rect.setAttribute('x', x);
                rect.setAttribute('y', y);
                rect.setAttribute('width', w);
                rect.setAttribute('height', barH);
                rect.setAttribute('rx', '2');
                rect.setAttribute('class', 'uml-bar');
                rect.setAttribute('data-id', id);
                g.appendChild(rect);
                break;
            }
            case 'pin': {
                const sz = Math.max(w, h, 6);
                const px = x + (w - sz) / 2, py = y + (h - sz) / 2;
                const rect = svgEl('rect');
                rect.setAttribute('x', px);
                rect.setAttribute('y', py);
                rect.setAttribute('width', sz);
                rect.setAttribute('height', sz);
                rect.setAttribute('rx', '1');
                rect.setAttribute('class', 'uml-bar');
                rect.setAttribute('data-id', id);
                g.appendChild(rect);
                if (node.labelBounds && node.name) {
                    const lb = node.labelBounds;
                    const lbl = svgEl('text');
                    lbl.setAttribute('x', lb.x);
                    lbl.setAttribute('y', lb.y + lb.h / 2);
                    lbl.setAttribute('text-anchor', 'start');
                    lbl.setAttribute('dominant-baseline', 'middle');
                    lbl.setAttribute('font-size', '10');
                    lbl.setAttribute('fill', '#1a1a1a');
                    lbl.setAttribute('font-family', 'Arial, sans-serif');
                    lbl.setAttribute('pointer-events', 'none');
                    lbl.textContent = node.name;
                    g.appendChild(lbl);
                }
                break;
            }
            case 'diamond': {
                const cx = x + w / 2, cy = y + h / 2;
                const poly = svgEl('polygon');
                poly.setAttribute('points', `${cx},${y} ${x + w},${cy} ${cx},${y + h} ${x},${cy}`);
                poly.setAttribute('class', 'uml-action');
                poly.setAttribute('data-id', id);
                g.appendChild(poly);
                if (name) {
                    const lbl = svgEl('text');
                    lbl.setAttribute('x', cx);
                    lbl.setAttribute('y', cy + 1);
                    lbl.setAttribute('class', 'node-lbl');
                    lbl.setAttribute('font-size', '10');
                    lbl.setAttribute('font-family', 'Arial, sans-serif');
                    lbl.setAttribute('fill', '#1a1a1a');
                    lbl.setAttribute('text-anchor', 'middle');
                    lbl.setAttribute('dominant-baseline', 'middle');
                    const displayName = name.length > 8 ? name.slice(0, 6) + '…' : name;
                    lbl.textContent = displayName;
                    g.appendChild(lbl);
                }
                break;
            }
            default: {
                const rx = Math.min(h / 2, 18);
                const rect = svgEl('rect');
                rect.setAttribute('x', x);
                rect.setAttribute('y', y);
                rect.setAttribute('width', w);
                rect.setAttribute('height', h);
                rect.setAttribute('rx', rx);
                rect.setAttribute('ry', rx);
                rect.setAttribute('class', 'uml-action');
                rect.setAttribute('data-id', id);
                g.appendChild(rect);

                // ★★★ 检查是否是 CallBehaviorAction（可能有子流程）★★★
                const isCallBehavior = node.type && (node.type.includes('CallBehaviorAction') || node.type === 'CallBehaviorActionImpl');
                let subprocessName = null;
                if (isCallBehavior) {
                    if (node.behaviorName) {
                        subprocessName = node.behaviorName;
                    }
                    if (!subprocessName) {
                        const cached = subprocessInfoCache.get(node.id);
                        if (cached && cached.hasSubprocess) {
                            subprocessName = cached.subprocessName;
                        }
                    }
                }

                // ★★★ 构建显示文本：节点名称 + 子流程名称（如果有）★★★
                let displayText = '';
                const nodeName = (name && name !== 'action' && name !== '' && name !== '未命名') ? name : '';

                if (isCallBehavior && subprocessName) {
                    if (nodeName) {
                        displayText = nodeName + ' «' + subprocessName + '»';
                    } else {
                        displayText = subprocessName;
                    }
                } else {
                    displayText = nodeName;
                }

                addLabel(g, displayText, x + w / 2, y + h / 2, w, h);
                break;
            }
        }

        zoomGroup.appendChild(g);
    }

    // ========================= 状态机节点绘制 =========================
    function drawStateMachineNode(node) {
        const { x, y, w, h, id } = node;
        const type = node.type || '';
        const name = node.name || '';

        const g = svgEl('g');
        g.setAttribute('data-node-grp', id);
        g.setAttribute('data-selected', 'false');
        g.style.cursor = 'pointer';

        g.addEventListener('click', ev => {
            ev.stopPropagation();
            selectNode(node);
        });

        g.addEventListener('dblclick', ev => {
            ev.stopPropagation();
            checkAndOpenSubprocess(node);
        });

        if (type.includes('Pseudostate')) {
            const r = Math.min(w, h) / 2;
            const cx = x + w / 2;
            const cy = y + h / 2;

            let isInitial = false;
            if (name && (name.toLowerCase().includes('initial') || name === '')) {
                isInitial = true;
            }

            if (isInitial) {
                const circle = svgEl('circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', r);
                circle.setAttribute('fill', '#3d3d3d');
                circle.setAttribute('data-id', id);
                circle.setAttribute('class', 'uml-initial');
                g.appendChild(circle);
            } else {
                const ring = svgEl('circle');
                ring.setAttribute('cx', cx);
                ring.setAttribute('cy', cy);
                ring.setAttribute('r', r);
                ring.setAttribute('fill', 'none');
                ring.setAttribute('stroke', '#3d3d3d');
                ring.setAttribute('stroke-width', '2');
                ring.setAttribute('data-id', id);
                ring.setAttribute('class', 'uml-final-ring');
                g.appendChild(ring);

                const dot = svgEl('circle');
                dot.setAttribute('cx', cx);
                dot.setAttribute('cy', cy);
                dot.setAttribute('r', r * 0.55);
                dot.setAttribute('fill', '#3d3d3d');
                dot.setAttribute('data-id', id);
                dot.setAttribute('class', 'uml-final-dot');
                g.appendChild(dot);
            }

        } else if (type.includes('State')) {
            const rx = Math.min(h / 2, 18);
            const rect = svgEl('rect');
            rect.setAttribute('x', x);
            rect.setAttribute('y', y);
            rect.setAttribute('width', w);
            rect.setAttribute('height', h);
            rect.setAttribute('rx', rx);
            rect.setAttribute('ry', rx);
            rect.setAttribute('class', 'uml-action');
            rect.setAttribute('data-id', id);
            g.appendChild(rect);

            if (name) {
                addLabel(g, name, x + w / 2, y + h / 2 - 8, w, h - 20);
            }

            if (node.doActivity) {
                const label = svgEl('text');
                label.setAttribute('x', x + w / 2);
                label.setAttribute('y', y + h / 2 + 16);
                label.setAttribute('class', 'node-lbl');
                label.setAttribute('font-size', '9');
                label.setAttribute('fill', '#8a7a4a');
                label.setAttribute('font-family', 'Arial, sans-serif');
                label.setAttribute('text-anchor', 'middle');
                label.textContent = 'do / ' + node.doActivity;
                g.appendChild(label);
            }

        } else {
            const rect = svgEl('rect');
            rect.setAttribute('x', x);
            rect.setAttribute('y', y);
            rect.setAttribute('width', w);
            rect.setAttribute('height', h);
            rect.setAttribute('rx', '4');
            rect.setAttribute('class', 'uml-action');
            rect.setAttribute('data-id', id);
            g.appendChild(rect);
            if (name) {
                addLabel(g, name, x + w / 2, y + h / 2, w, h);
            }
        }

        zoomGroup.appendChild(g);
    }

    // ========================= 连线绘制 =========================
    function drawEdge(edge) {
        if (!edge.points || edge.points.length < 2) return;

        const pts = [...edge.points].reverse();
        const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ');

        const t = edge.type || '';
        let isDashed;
        if (t === 'ControlFlowImpl') isDashed = true;
        else if (t === 'ObjectFlowImpl') isDashed = false;
        else isDashed = t.toLowerCase().includes('control') || !!edge.isDashed;

        const hit = svgEl('path');
        hit.setAttribute('d', d);
        hit.setAttribute('class', 'edge-hit');
        hit.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(edge); });
        zoomGroup.appendChild(hit);

        const path = svgEl('path');
        path.setAttribute('d', d);
        path.setAttribute('class', `uml-edge${isDashed ? ' dashed' : ''}`);
        path.setAttribute('data-id', edge.id);
        path.setAttribute('marker-end', 'url(#arr)');
        path.addEventListener('click', ev => { ev.stopPropagation(); selectEdge(edge); });
        zoomGroup.appendChild(path);

        if (edge.label) {
            const mid = pts[Math.floor(pts.length / 2)];
            const p0 = pts[Math.max(0, Math.floor(pts.length / 2) - 1)];
            const dx = mid[0] - p0[0], dy = mid[1] - p0[1], len = Math.sqrt(dx * dx + dy * dy) || 1;
            const ox = -dy / len * 10, oy = dx / len * 10;
            const lbl = svgEl('text');
            lbl.setAttribute('x', mid[0] + ox);
            lbl.setAttribute('y', mid[1] + oy);
            lbl.setAttribute('class', 'edge-lbl');
            lbl.setAttribute('text-anchor', 'middle');
            lbl.textContent = edge.label;
            zoomGroup.appendChild(lbl);
        }
    }

    function renderDiagram() {
        if (!currentData || !zoomGroup) return;
        while (zoomGroup.firstChild) zoomGroup.removeChild(zoomGroup.firstChild);

        isStateMachineDiagram = detectDiagramType(currentData);

        // ★★★ 定义允许绘制的节点类型 ★★★
        const ALLOWED_NODE_TYPES = [
            // 活动图节点
            'ActionImpl',
            'CallBehaviorActionImpl',
            'OpaqueActionImpl',
            'OpaqueAction',
            'InitialNodeImpl',
            'ActivityFinalNodeImpl',
            'FlowFinalNodeImpl',
            'DecisionNodeImpl',
            'MergeNodeImpl',
            'ForkNodeImpl',
            'JoinNodeImpl',
            'OutputPinImpl',
            'InputPinImpl',
            'ActivityParameterNodeImpl',
            // 状态机节点
            'State',
            'Pseudostate',
            'FinalState',
            'StateMachine'
        ];

        // ★★★ 过滤节点：泳道（包括视图类型）和标准节点 ★★★
        const filteredNodes = (currentData.nodes || []).filter(node => {
            const nodeType = node.type || '';

            // ★★★ 优先保留泳道相关类型 ★★★
            if (node.isSwimlane ||
                nodeType === 'SwimlaneView' ||
                nodeType === 'SwimlaneCellView' ||
                nodeType.includes('Swimlane')) {
                // 确保泳道标记正确
                node.isSwimlane = true;
                return true;
            }

            // 检查节点类型是否在允许列表中
            const isAllowed = ALLOWED_NODE_TYPES.some(allowed => {
                return nodeType === allowed || nodeType.endsWith(allowed) || nodeType.includes(allowed);
            });

            if (!isAllowed) {
                console.log('[Render] 跳过不允许的节点类型:', nodeType, node.name);
            }
            return isAllowed;
        });

        // 更新 currentData.nodes 为过滤后的列表
        currentData.nodes = filteredNodes;

        // 同样过滤 edges（只保留连接有效节点的边）
        const validNodeIds = new Set(filteredNodes.map(n => n.id));
        currentData.edges = (currentData.edges || []).filter(edge => {
            return validNodeIds.has(edge.sourceId) && validNodeIds.has(edge.targetId);
        });

        // 绘制
        drawGrid();
        currentData.edges.forEach(drawEdge);

        // 先画泳道
        currentData.nodes.forEach(node => {
            if (node.isSwimlane) {
                drawSwimlane(node);
            }
        });

        // 再画普通节点
        currentData.nodes.forEach(node => {
            if (!node.isSwimlane) {
                if (isStateMachineDiagram) {
                    drawStateMachineNode(node);
                } else {
                    drawNode(node);
                }
            }
        });

        // 标记有子流程的节点
        if (wsReady()) {
            currentData.nodes.forEach(node => {
                if (node.type && (node.type.includes('CallBehaviorAction') || node.type === 'CallBehaviorActionImpl')) {
                    if (!node.behaviorName && !subprocessInfoCache.has(node.id)) {
                        ws.send(JSON.stringify({
                            command: 'get_node_subprocess',
                            nodeId: node.id
                        }));
                        subprocessInfoCache.set(node.id, { loading: true });
                    }
                }
            });
        }

        setTimeout(updateAllIndicatorValues, 500);
    }

    function drawGrid() {
        const b = calculateBounds(), step = 20;
        const frag = document.createDocumentFragment();
        for (let x = b.minX; x <= b.minX + b.width; x += step) {
            const l = svgEl('line');
            l.setAttribute('x1', x);
            l.setAttribute('y1', b.minY);
            l.setAttribute('x2', x);
            l.setAttribute('y2', b.minY + b.height);
            l.setAttribute('stroke', '#e8ecf0');
            l.setAttribute('stroke-width', '.5');
            frag.appendChild(l);
        }
        for (let y = b.minY; y <= b.minY + b.height; y += step) {
            const l = svgEl('line');
            l.setAttribute('x1', b.minX);
            l.setAttribute('y1', y);
            l.setAttribute('x2', b.minX + b.width);
            l.setAttribute('y2', y);
            l.setAttribute('stroke', '#e8ecf0');
            l.setAttribute('stroke-width', '.5');
            frag.appendChild(l);
        }
        zoomGroup.appendChild(frag);
    }

    // ========================= 选中 =========================
    function selectNode(node) {
        clearSelection();
        selectedNodeId = node.id;
        selectedEdgeId = null;
        const g = zoomGroup?.querySelector(`[data-node-grp="${node.id}"]`);
        if (g) g.setAttribute('data-selected', 'true');
        allEls(node.id).forEach(e => e.classList.add('selected'));

        latestRuntimeValues = {};
        showNodePanel(node, activeNodes.has(node.id));
        requestNodeVariables(node);
        refreshSelectedNodeVariablesPanel();

        if (node.type && (node.type.includes('CallBehaviorAction') || node.type === 'CallBehaviorActionImpl')) {
            showSubprocessInfoInPanel(node);
        }

        if ((node.type && node.type.includes('OpaqueAction')) || node.type === 'ActionImpl') {

    // ========================= 子流程相关 =========================
    function checkAndOpenSubprocess(node) {
        if (!wsReady()) {
            showNotification('未连接，无法检查子流程', true);
            return;
        }

        if (subprocessInfoCache.has(node.id)) {
            const cached = subprocessInfoCache.get(node.id);
            if (cached.hasSubprocess && cached.hasDiagram) {
                showNotification('找到子流程: ' + cached.subprocessName + '，正在加载...');
                loadSubprocessDiagram(node.id);
                return;
            } else if (cached.hasSubprocess && !cached.hasDiagram) {
                showNotification('节点有子流程 (' + cached.subprocessName + ')，但没有对应的图', true);
                return;
            } else {
                showNotification('节点 "' + node.name + '" 没有绑定子流程');
                return;
            }
        }

        showNotification('检查节点是否有子流程...');

        const callbackId = 'subprocess_' + Date.now() + '_' + node.id;

        window._configCallbacks[callbackId] = (msg) => {
            subprocessInfoCache.set(node.id, msg);

            if (msg.isCallBehaviorAction && msg.hasSubprocess) {
                const subName = msg.subprocessName || '未命名';
                if (msg.hasDiagram) {
                    showNotification('找到子流程: ' + subName + '，正在加载图...');
                    markNodeWithSubprocess(node.id, subName);
                    loadSubprocessDiagram(node.id);
                } else {
                    showNotification('节点有子流程 (' + subName + ')，但没有对应的图', true);
                    markNodeWithSubprocess(node.id, subName);
                }
            } else {
                showNotification('节点 "' + node.name + '" 没有绑定子流程');
            }
            delete window._configCallbacks[callbackId];
        };

        ws.send(JSON.stringify({
            command: 'get_node_subprocess',
            nodeId: node.id,
            _callbackId: callbackId
        }));
    }

    function loadSubprocessDiagram(nodeId) {
        if (!wsReady()) {
            showNotification('未连接，无法加载子流程图', true);
            return;
        }

        if (currentData && !isInSubprocess) {
            navigationStack.push({
                diagramId: diagramId,
                diagramName: diagramName,
                data: JSON.parse(JSON.stringify(currentData)),
                parentNodeId: null
            });
        } else if (isInSubprocess && currentSubprocessNodeId) {
            navigationStack.push({
                diagramId: diagramId,
                diagramName: diagramName,
                data: JSON.parse(JSON.stringify(currentData)),
                parentNodeId: currentSubprocessNodeId
            });
        }

        showNotification('正在加载子流程图...');

        const callbackId = 'load_subprocess_' + Date.now();

        window._configCallbacks[callbackId] = (msg) => {
            if (msg.success && msg.data) {
                const subData = msg.data;
                const subName = msg.diagramName || '子流程';
                const subId = msg.diagramId;

                currentSubprocessNodeId = nodeId;
                isInSubprocess = true;

                currentData = subData;
                if (currentData.nodes) {
                    currentData.nodes = currentData.nodes.filter(n => n.type !== 'DiagramImpl');
                }

                diagramId = subId;
                diagramName = subName;

                document.getElementById('diagramTitle').textContent = subName + ' (子流程)';

                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('diagramSvg').style.display = 'block';
                initSVG();
                renderDiagram();
                restoreSimulationState();
                setTimeout(fitView, 100);

                updateBreadcrumb(subName, true);

                clearSelection();
                document.getElementById('panelContent').innerHTML = `
                            <div class="empty-state">已进入子流程: ${escapeHtml(subName)}<br>
                            双击节点可继续深入，或点击上方导航返回</div>
                        `;

                showNotification('已加载子流程图: ' + subName);
                appendEventLog('进入子流程: ' + subName + ' (ID: ' + subId + ')', 'info');

                setTimeout(() => {
                    loadAllNodeConfigs();
                }, 500);

            } else {
                const errorMsg = msg.message || '加载子流程图失败';
                showNotification(errorMsg, true);
                appendEventLog('加载子流程图失败: ' + errorMsg, 'error');
                navigationStack.pop();
            }
            delete window._configCallbacks[callbackId];
        };

        ws.send(JSON.stringify({
            command: 'get_subprocess_diagram_json',
            nodeId: nodeId,
            _callbackId: callbackId
        }));
    }

    function updateBreadcrumb(diagramName, isSub) {
        const nav = document.getElementById('breadcrumbNav');
        const currentName = document.getElementById('currentDiagramName');
        const info = document.getElementById('diagramInfo');
        const levelIndicator = document.getElementById('levelIndicator');

        if (isSub || isInSubprocess) {
            nav.style.display = 'flex';
            currentName.textContent = diagramName || '子流程';
            const level = navigationStack.length + 1;
            levelIndicator.textContent = '层级 ' + level;
            info.textContent = '节点: ' + (navigationStack.length > 0 ? navigationStack[navigationStack.length - 1].diagramName : '主图') + ' → ' + diagramName;
        } else {
            nav.style.display = 'none';
        }
    }

    function navigateToParentDiagram() {
        if (navigationStack.length === 0) {
            showNotification('没有上级图可以返回', true);
            return;
        }

        const parent = navigationStack.pop();

        currentData = parent.data;
        diagramId = parent.diagramId;
        diagramName = parent.diagramName;

        document.getElementById('diagramTitle').textContent = diagramName;

        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('diagramSvg').style.display = 'block';
        initSVG();
        renderDiagram();
        restoreSimulationState();
        setTimeout(fitView, 100);

        isInSubprocess = navigationStack.length > 0;
        if (!isInSubprocess) {
            currentSubprocessNodeId = null;
            document.getElementById('breadcrumbNav').style.display = 'none';
            document.getElementById('panelContent').innerHTML = `
                        <div class="empty-state">已返回主图<br>点击节点查看详情</div>
                    `;
        } else {
            const last = navigationStack[navigationStack.length - 1];
            updateBreadcrumb(last.diagramName, true);
            document.getElementById('panelContent').innerHTML = `
                        <div class="empty-state">已返回: ${escapeHtml(last.diagramName)}<br>
                        双击节点可继续深入</div>
                    `;
        }

        clearSelection();
        showNotification('已返回: ' + diagramName);
        appendEventLog('返回上级图: ' + diagramName, 'info');

        setTimeout(() => {
            loadAllNodeConfigs();
        }, 500);
    }

    function navigateToRootDiagram() {
        if (navigationStack.length === 0) {
            showNotification('已经在主图', true);
            return;
        }

        const root = navigationStack[0];
        navigationStack = [];

        currentData = root.data;
        diagramId = root.diagramId;
        diagramName = root.diagramName;

        document.getElementById('diagramTitle').textContent = diagramName;

        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('diagramSvg').style.display = 'block';
        initSVG();
        renderDiagram();
        restoreSimulationState();
        setTimeout(fitView, 100);

        isInSubprocess = false;
        currentSubprocessNodeId = null;
        document.getElementById('breadcrumbNav').style.display = 'none';
        document.getElementById('panelContent').innerHTML = `
                    <div class="empty-state">已返回主图<br>点击节点查看详情</div>
                `;

        clearSelection();
        showNotification('已返回主图: ' + diagramName);
        appendEventLog('返回主图: ' + diagramName, 'info');

        setTimeout(() => {
            loadAllNodeConfigs();
        }, 500);
    }

    function markNodeWithSubprocess(nodeId, subprocessName) {
        const g = zoomGroup?.querySelector(`[data-node-grp="${nodeId}"]`);
        if (!g) return;

        if (g.querySelector('.subprocess-marker')) return;

        const node = currentData?.nodes?.find(n => n.id === nodeId);
        if (!node) return;

        g.classList.add('has-subprocess');
        const actionEl = g.querySelector('.uml-action');
        if (actionEl) {
            actionEl.classList.add('has-subprocess');
        }

        const marker = svgEl('g');
        marker.setAttribute('class', 'subprocess-marker');
        marker.setAttribute('transform', `translate(${node.x + node.w - 14}, ${node.y + 4})`);

        const circle = svgEl('circle');
        circle.setAttribute('r', '8');
        circle.setAttribute('fill', '#cc0000');
        circle.setAttribute('stroke', 'white');
        circle.setAttribute('stroke-width', '1.5');
        circle.setAttribute('opacity', '0.9');
        marker.appendChild(circle);

        const text = svgEl('text');
        text.setAttribute('x', '0');
        text.setAttribute('y', '2');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.setAttribute('font-size', '8');
        text.setAttribute('fill', 'white');
        text.setAttribute('font-weight', 'bold');
        text.textContent = '▶';
        marker.appendChild(text);

        marker.setAttribute('title', '子流程: ' + subprocessName);

        marker.addEventListener('click', (ev) => {
            ev.stopPropagation();
            const node = currentData?.nodes?.find(n => n.id === nodeId);
            if (node) checkAndOpenSubprocess(node);
        });
        marker.addEventListener('dblclick', (ev) => {
            ev.stopPropagation();
            const node = currentData?.nodes?.find(n => n.id === nodeId);
            if (node) checkAndOpenSubprocess(node);
        });

        g.appendChild(marker);
    }

    // ========================= 配置加载 =========================
    function loadNodeFullConfig(taskName) {
        if (!wsReady()) {
            const area = document.getElementById('nodeFullConfigArea');
            if (area) {
                area.innerHTML = '<span style="color:#cc0000;">未连接，无法加载配置</span>';
            }
            return;
        }

        const cachedConfig = getCachedNodeConfig(taskName);
        if (cachedConfig) {
            renderFullConfigEditor(cachedConfig);
            updateIndicatorValuesForNode(taskName, cachedConfig);
            refreshSelectedNodeVariablesPanel();
            return;
        }

        const callbackId = 'fullconfig_' + Date.now() + '_' + taskName.replace(/\s+/g, '_');

        window._configCallbacks[callbackId] = (msg) => {
            if (msg.config) {
                putNodeConfig(taskName, msg.config);
                renderFullConfigEditor(msg.config);
                updateIndicatorValuesForNode(taskName, msg.config);
                refreshSelectedNodeVariablesPanel();
            } else {
                renderFullConfigEditor({ error: '未收到配置数据' });
            }
            delete window._configCallbacks[callbackId];
        };

        ws.send(JSON.stringify({
            command: 'get_node_full_config',
            taskName: taskName,
            _callbackId: callbackId
        }));
    }

    // ========================= 指标值更新 =========================
    function updateIndicatorValuesForNode(taskName, config) {
        if (!config || !config.allProperties) return;

        const allProps = config.allProperties;
        const boundIndicators = getIndicatorsBoundToNode(taskName);

        boundIndicators.forEach(indicatorId => {
            const propName = getIndicatorPropertyName(indicatorId);
            let value = allProps[propName];

            if (value === undefined) {
                const lowerKey = propName.toLowerCase();
                for (const key of Object.keys(allProps)) {
                    if (key.toLowerCase() === lowerKey) {
                        value = allProps[key];
                        break;
                    }
                }
            }
            if (value === undefined && propName.includes('_')) {
                const noUnderscore = propName.replace(/_/g, '');
                const lowerNoUnderscore = noUnderscore.toLowerCase();
                for (const key of Object.keys(allProps)) {
                    if (key.toLowerCase() === lowerNoUnderscore || key.toLowerCase().includes(lowerNoUnderscore)) {
                        value = allProps[key];
                        break;
                    }
                }
            }
            if (value === undefined) {
                const lowerProp = propName.toLowerCase();
                for (const key of Object.keys(allProps)) {
                    const lowerKey = key.toLowerCase();
                    if (lowerKey.includes(lowerProp) || lowerProp.includes(lowerKey)) {
                        value = allProps[key];
                        break;
                    }
                }
            }

            if (value !== undefined) {
                indicatorValues.set(indicatorId, {
                    value: value,
                    source: taskName,
                    timestamp: new Date().toISOString()
                });
            } else {
                indicatorValues.set(indicatorId, {
                    value: null,
                    source: taskName,
                    timestamp: new Date().toISOString(),
                    error: '属性 "' + propName + '" 未找到'
                });
            }
        });
        refreshIndicatorTree();
    }

    function getIndicatorsBoundToNode(nodeName) {
        const result = [];
        indicatorBindings.forEach((boundNode, indicatorId) => {
            if (boundNode === nodeName) result.push(indicatorId);
        });
        return result;
    }

    function getIndicatorPropertyName(indicatorId) {
        const mapping = {
            'install_time': '装备安装时间',
            'pipe_check_time': '管路检测时间',
            'subsystem_test_time': '分系统测试时间',
            'filling_time': '加注时间',
            'transfer_time': '转运时间',
            'install_manpower': '装备安装人力',
            'pipe_check_manpower': '管路检测人力',
            'subsystem_test_manpower': '分系统测试人力',
            'filling_manpower': 'fillingManpower',
            'transfer_manpower': 'transferManpower',
            'installTime': 'installTime',
            'pipeCheckTime': 'pipeCheckTime',
            'subsystemTestTime': 'subsystemTestTime',
            'fillingTime': 'fillingTime',
            'transferTime': 'transferTime',
            'installManpower': 'installManpower',
            'pipeCheckManpower': 'pipeCheckManpower',
            'subsystemTestManpower': 'subsystemTestManpower',
            'fillingManpower': 'fillingManpower',
            'transferManpower': 'transferManpower'
        };
        return mapping[indicatorId] || indicatorId;
    }

    function updateAllIndicatorValues() {
        indicatorBindings.forEach((nodeName, indicatorId) => {
            if (nodeFullConfigCache.has(nodeName)) {
                updateIndicatorValuesForNode(nodeName, nodeFullConfigCache.get(nodeName));
            } else if (nodeConfigCache.has(nodeName)) {
                updateIndicatorValuesForNode(nodeName, nodeConfigCache.get(nodeName));
            } else {
                const existing = indicatorValues.get(indicatorId);
                if (!existing || existing.value === undefined) {
                    indicatorValues.set(indicatorId, {
                        value: null,
                        source: nodeName,
                        timestamp: new Date().toISOString(),
                        loading: true
                    });
                }
            }
        });
        refreshIndicatorTree();
    }

    function refreshIndicatorValues() {
        let updatedCount = 0;
        indicatorBindings.forEach((nodeName, indicatorId) => {
            let config = null;
            if (nodeFullConfigCache.has(nodeName)) config = nodeFullConfigCache.get(nodeName);
            else if (nodeConfigCache.has(nodeName)) config = nodeConfigCache.get(nodeName);

            if (config && config.allProperties) {
                const allProps = config.allProperties;
                const propName = getIndicatorPropertyName(indicatorId);
                let value = allProps[propName];

                if (value === undefined) {
                    const lowerKey = propName.toLowerCase();
                    for (const key of Object.keys(allProps)) {
                        if (key.toLowerCase() === lowerKey) { value = allProps[key]; break; }
                    }
                }
                if (value === undefined) {
                    const lowerProp = propName.toLowerCase();
                    for (const key of Object.keys(allProps)) {
                        const lowerKey = key.toLowerCase();
                        if (lowerKey.includes(lowerProp) || lowerProp.includes(lowerKey)) {
                            value = allProps[key];
                            break;
                        }
                    }
                }

                if (value !== undefined) {
                    indicatorValues.set(indicatorId, {
                        value: value,
                        source: nodeName,
                        timestamp: new Date().toISOString()
                    });
                    updatedCount++;
                }
            }
        });
        refreshIndicatorTree();
        showNotification('已刷新 ' + updatedCount + ' 个指标值');
    }

    function submitAllProperties(taskName) {
        if (!wsReady()) {
            showNotification('未连接，无法提交修改', true);
            return;
        }

        const inputs = document.querySelectorAll('.prop-edit-input');
        const statusDiv = document.getElementById('allPropsSubmitStatus');

        if (!statusDiv) {
            showNotification('找不到状态显示区域', true);
            return;
        }

        const properties = {};
        inputs.forEach(input => {
            const key = input.dataset.propKey;
            let value = input.value.trim();
            if (value === '') {
                properties[key] = null;
                return;
            }
            const numValue = parseFloat(value);
            if (!isNaN(numValue) && value.indexOf(' ') === -1) {
                if (Number.isInteger(numValue) && value.indexOf('.') === -1) {
                    properties[key] = parseInt(value, 10);
                } else {
                    properties[key] = numValue;
                }
            } else {
                properties[key] = value;
            }
        });

        if (Object.keys(properties).length === 0) {
            statusDiv.className = 'submit-status error';
            statusDiv.textContent = '没有可保存的属性';
            return;
        }

        statusDiv.className = 'submit-status loading';
        statusDiv.textContent = '提交中...';

        const callbackId = 'full_update_all_' + Date.now() + '_' + taskName.replace(/\s+/g, '_');

        window._configCallbacks[callbackId] = (msg) => {
            if (msg.success) {
                statusDiv.className = 'submit-status success';
                statusDiv.textContent = '✅ ' + (msg.message || '所有属性已保存到 MagicDraw');
                showNotification('节点 "' + msg.taskName + '" 所有属性已更新');
                nodeFullConfigCache.delete(taskName);
                nodeConfigCache.delete(taskName);
                allNodeConfigsLoaded = false;
                setTimeout(() => {
                    loadNodeFullConfig(taskName);
                    updateAllIndicatorValues();
                }, 500);
            } else {
                statusDiv.className = 'submit-status error';
                statusDiv.textContent = '保存失败: ' + escapeHtml(msg.message || '未知错误');
                showNotification('属性保存失败: ' + (msg.message || '未知错误'), true);
            }
            delete window._configCallbacks[callbackId];
        };

        ws.send(JSON.stringify({
            command: 'update_node_full_config',
            taskName: taskName,
            properties: properties,
            _callbackId: callbackId
        }));
    }

    function selectNodeByName(name) {
        if (!currentData) return;
        const node = currentData.nodes.find(n => n.name === name);
        if (node) {
            selectNode(node);
            const svgEl = document.getElementById('diagramSvg');
            if (svgEl) {
                const b = calculateBounds();
                const cx = node.x + node.w / 2;
                const cy = node.y + node.h / 2;
                const w = svgEl.clientWidth || 800;
                const h = svgEl.clientHeight || 600;
                const sc = Math.min(w / b.width, h / b.height) * 0.8;
                const tx = (w - b.width * sc) / 2 - b.minX * sc;
                const ty = (h - b.height * sc) / 2 - b.minY * sc;
                const targetTx = tx - cx * sc + w / 2;
                const targetTy = ty - cy * sc + h / 2;
                d3.select('#diagramSvg').transition().duration(400)
                    .call(zoomBehavior.transform, d3.zoomIdentity.translate(targetTx, targetTy).scale(sc));
            }
        } else {
            showNotification('未找到节点: ' + name, true);
        }
    }

    function exportAllNodeConfigs() {
        const configs = {};
        nodeFullConfigCache.forEach((cfg, name) => { configs[name] = cfg; });
        if (Object.keys(configs).length === 0) {
            showNotification('没有缓存的配置数据，请先加载', true);
            return;
        }
        const dataStr = JSON.stringify(configs, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'node_configs_' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification('已导出 ' + Object.keys(configs).length + ' 个节点配置');
    }

    function parseInitResourcePoolArgs(body) {
        const m = body.match(/initResourcePool\s*\(\s*ALH\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
        if (!m) return null;
        return { total: m[1], scale: m[2] };
    }

    function requestLatestReplay() {

        ws.send(JSON.stringify({ command: 'get_latest_replay' }));

    }

    function startReplay(record) {
        if (!record || !Array.isArray(record.events)) {
            showNotification('回放数据格式不正确', true);
            return;
        }
        if (replayTimer) { clearInterval(replayTimer);
            replayTimer = null; }

        replayEvents = record.events.slice().sort((a, b) => (a.time || 0) - (b.time || 0));
        replayIndex = 0;
        replayStartTime = Date.now();
        replaySpeed = simSpeed || 1.0;

        const info = document.getElementById('replayInfo');
        if (info) {
            info.innerHTML = '当前回放：<span class="replay-badge">' + escapeHtml(record.runId || 'latest') + '</span><br>' +
                '图：' + escapeHtml(record.diagramName || '未知') + '<br>' +
                '启动方式：' + escapeHtml(record.startMode || '未知');
        }

        if (record.diagramSnapshot && record.diagramSnapshot.nodes) {
            currentData = record.diagramSnapshot;
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('diagramSvg').style.display = 'block';
            initSVG();
            renderDiagram();
            setTimeout(fitView, 100);
        }

        clearAllActiveStates();
        updateRuntimeValues({});
        appendEventLog('开始回放：' + (record.runId || 'latest'), 'info');
        const statusEl = document.getElementById('simStatus');
        if (statusEl) { statusEl.className = 'sim-status running';
            statusEl.textContent = '回放中'; }

        replayTimer = setInterval(tickReplay, 30);
    }

    function tickReplay() {
        if (replayIndex >= replayEvents.length) {
            clearInterval(replayTimer);
            replayTimer = null;
            appendEventLog('回放结束', 'info');
            const statusEl = document.getElementById('simStatus');
            if (statusEl) { statusEl.className = 'sim-status ended';
                statusEl.textContent = '回放结束'; }
            return;
        }
        const elapsed = (Date.now() - replayStartTime) * replaySpeed;
        while (replayIndex < replayEvents.length && (replayEvents[replayIndex].time || 0) <= elapsed) {
            applyReplayEvent(replayEvents[replayIndex++]);
        }
    }

    function applyReplayEvent(e) {
        if (!e || !e.event) return;
        switch (e.event) {
            case 'sim_start':
                clearAllActiveStates();
                appendEventLog('回放：仿真开始', 'info');
                break;
            case 'node_activate':
                activateNode(e.nodeId);
                break;
            case 'node_deactivate':
                deactivateNode(e.nodeId);
                break;
            case 'runtime_values':
                updateRuntimeValues(e.values || {});
                break;
            case 'log':
                appendEventLog(e.message || '', e.level || 'info', e.timeText || '');
                break;
            case 'sim_end':
                appendEventLog('回放：仿真结束 ' + (e.status || ''), 'info');
                break;
            case 'state_entered':
                activateNode(e.nodeId);
                appendEventLog('🔵 状态进入: ' + (e.nodeName || e.nodeId), 'info');
                break;
            case 'state_exited':
                deactivateNode(e.nodeId);
                appendEventLog('🔴 状态退出: ' + (e.nodeName || e.nodeId), 'info');
                break;
            case 'pseudostate_activated':
                if (e.type === 'initial_state') {
                    appendEventLog('⏺ 进入初始状态: ' + (e.nodeName || ''), 'info');
                } else {
                    appendEventLog('⏹ 到达终止状态: ' + (e.nodeName || ''), 'info');
                }
                activateNode(e.nodeId);
                break;
            case 'state_behavior_executed':
                const emoji = e.behaviorType === 'entry' ? '🔵' :
                    e.behaviorType === 'do' ? '🟢' : '🔴';
                appendEventLog(emoji + ' 状态行为: ' + e.behaviorType + ' -> ' + (e.behaviorName || ''), 'info');
                break;
        }
    }

    // ========================= WebSocket =========================
    function toggleConnection() { isConnected ? disconnectWS() : connectWS(); }

    function connectWS() {
        if (ws && ws.readyState === WebSocket.OPEN) return;
        const statusEl = document.getElementById('simStatus');
        statusEl.className = 'sim-status';
        statusEl.textContent = '连接中...';
        ws = new WebSocket('ws://127.0.0.1:8765');

        ws.onopen = () => {
            isConnected = true;
            statusEl.className = 'sim-status connected';
            statusEl.textContent = '已连接 MagicDraw';
            document.getElementById('connectBtn').textContent = '断开';
            updateControlButtons(true);
            showNotification('WebSocket 已就绪，可控制仿真');
            sendSpeedToBackend();
            const diagramId = getUrlParam('diagramId');
            if (diagramId && !diagramRequested) {
                diagramRequested = true;
                ws.send(JSON.stringify({ command: 'get_diagram_json', diagramId }));
            }
            setTimeout(() => {
                loadStateMachineTriggers();
            }, 500);
        };

        ws.onclose = () => {
            isConnected = false;
            ws = null;
            allNodeConfigsLoaded = false;
            allNodeConfigsLoadingPromise = null;
            latestRuntimeValues = {};
            statusEl.className = 'sim-status';
            statusEl.textContent = '未连接';
            document.getElementById('connectBtn').textContent = '连接';
            updateControlButtons(false);
            if (isRecording) stopRecording();
            const container = document.getElementById('triggerContainer');
            if (container) {
                container.innerHTML = '<span class="trigger-empty">已断开连接</span>';
            }
        };

        ws.onerror = () => {
            statusEl.className = 'sim-status';
            statusEl.textContent = '连接失败';
            showNotification('无法连接至 MagicDraw 插件，请确认插件已运行', true);
        };

        ws.onmessage = evt => {
            try { handleSimEvent(JSON.parse(evt.data)); } catch (e) { console.warn('非JSON消息', evt.data); }
        };
    }

    function disconnectWS() { ws?.close();
        ws = null; }

    function updateControlButtons(on) {
        ['startSimBtn', 'startContextBtn', 'startConfigBtn', 'stopSimBtn', 'replayBtn'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.disabled = !on;
        });
    }

    // ========================= 消息处理 - 修改 node_subprocess_info =========================
    function handleSimEvent(msg) {
        const statusEl = document.getElementById('simStatus');

        switch (msg.event) {
            case 'backend_error':
                appendEventLog(msg.message || '后端发生错误', 'error', msg.time);
                showNotification(msg.message || '后端错误', true);
                break;

            case 'backend_info':
                appendEventLog(msg.message || '后端提示', 'info', msg.time);
                showNotification(msg.message || '');
                break;

            case 'log':
                appendEventLog(msg.message || '', msg.level || 'info', msg.time);
                break;

            case 'status':
                if (msg.status === 'ready') showNotification('MagicDraw 后端已就绪');
                break;

            case 'diagram_json':
                applyDiagramData(msg.data, msg.name);
                break;

            case 'sim_start':
                clearAllActiveStates();
                statusEl.className = 'sim-status running';
                statusEl.textContent = '仿真运行中';
                showNotification('MagicDraw 仿真已开始');
                startRecording(msg);
                break;

            case 'sim_end':
                if (isRecording && currentRunId) {
                    activeNodes.forEach(nodeId => {
                        if (deactivateTimers.has(nodeId)) {
                            clearTimeout(deactivateTimers.get(nodeId));
                            deactivateTimers.delete(nodeId);
                        }
                        const node = findLoadedNode(nodeId);
                        let finalVars = null;
                        if (node) {
                            finalVars = collectNodeVariables(node);
                            finalVars._finishedAt = new Date().toISOString();
                            finalVars._status = 'sim_end';
                        }
                        recordNodeFinishWithVars(currentRunId, nodeId, null, null, finalVars);
                    });
                    // 不在这里直接清空 activeNodes。
                    // clearTransientActiveStates() 会把这些节点转成 visited/done，
                    // 从而让仿真结束后的最终执行路径继续保持绿色。
                    clearTransientActiveStates();
                } else {
                    // 即使没有开启数据库记录，也要保留最终执行路径。
                    clearTransientActiveStates();
                }

                if (wsReady()) {
                    // 双保险：服务器正常会在 sim_end 前主动广播 simulation_summary，
                    // 这里再主动查询一次，避免网络时序导致汇总遗漏。
                    ws.send(JSON.stringify({ command: 'get_all_node_stats' }));
                    ws.send(JSON.stringify({ command: 'get_simulation_summary' }));
                    setTimeout(async () => {
                        try {
                            await Promise.race([
                                summarySavePromise || Promise.resolve(),
                                new Promise(resolve => setTimeout(resolve, 1200))
                            ]);
                        } catch (ignored) {}
                        statusEl.className = 'sim-status ended';
                        statusEl.textContent = '仿真已结束';
                        showNotification('仿真结束');
                        stopRecording();
                    }, 650);
                }
                break;

            case 'node_activate':
                activateNode(msg.nodeId);
                break;

            case 'node_deactivate':
                deactivateNode(msg.nodeId);
                break;

            case 'clear_all':
                // 后端在仿真结束后会发送 clear_all。这里不再把本轮完成路径清掉，
                // 只把尚处于 active 的节点收尾成 done。下一轮 sim_start 才真正全清。
                clearTransientActiveStates();
                break;

            case 'runtime_values':
                latestRuntimeValues = { ...(msg.values || {}) };
                refreshSelectedNodeVariablesPanel();
                break;

            case 'node_variables': {
                const values = {};
                (msg.variables || []).forEach(item => {
                    if (item && item.name !== undefined) values[item.name] = item.value;
                });
                latestRuntimeValues = values;
                refreshSelectedNodeVariablesPanel();
                break;
            }

            case 'replay_data':
                startReplay(msg.record);
                break;

            case 'replay_saved': {
                const info = document.getElementById('replayInfo');
                if (info) info.innerHTML = '已保存最近一次回放：<span class="replay-badge">' + escapeHtml(msg.runId || '') + '</span>';
                appendEventLog('回放记录已保存：' + (msg.runId || ''), 'info', msg.time);
                break;
            }

            case 'external_interaction_request':
                appendEventLog('外部交互请求: ' + (msg.nodeName || ''), 'warn', msg.time);
                showNotification('需要外部输入: ' + (msg.nodeName || ''));
                renderExternalInteractionForm(msg);
                break;

            case 'state_machine_triggers':
                handleStateMachineTriggers(msg);
                break;

            case 'signal_sent':
                if (msg.success) {
                    showNotification('✅ 信号已发送: ' + (msg.signalName || '') + (msg.method ? ' (' + msg.method + ')' : ''));
                    appendEventLog('✅ 信号已发送: ' + (msg.signalName || '') + (msg.method ? ' (' + msg.method + ')' : ''), 'info');
                } else {
                    showNotification('❌ 信号发送失败: ' + (msg.error || msg.signalName || ''), true);
                    appendEventLog('❌ 信号发送失败: ' + (msg.error || msg.signalName || ''), 'error');
                }
                break;

            case 'state_entered':
                activateNode(msg.nodeId);
                appendEventLog('🔵 状态进入: ' + (msg.nodeName || msg.nodeId), 'info');
                const stateNode = currentData?.nodes?.find(n => n.id === msg.nodeId);
                if (stateNode) {
                    selectedNodeId = msg.nodeId;
                    showNodePanel(stateNode, true);
                }
                break;

            case 'state_exited':
                deactivateNode(msg.nodeId);
                appendEventLog('🔴 状态退出: ' + (msg.nodeName || msg.nodeId), 'info');
                break;

            case 'pseudostate_activated':
                if (msg.type === 'initial_state') {
                    appendEventLog('⏺ 进入初始状态: ' + (msg.nodeName || ''), 'info');
                } else {
                    appendEventLog('⏹ 到达终止状态: ' + (msg.nodeName || ''), 'info');
                }
                activateNode(msg.nodeId);
                break;

            case 'state_behavior_executed':
                const behaviorEmoji = msg.behaviorType === 'entry' ? '🔵' :
                    msg.behaviorType === 'do' ? '🟢' : '🔴';
                appendEventLog(behaviorEmoji + ' 状态行为: ' + msg.behaviorType + ' -> ' + (msg.behaviorName || ''), 'info');
                break;

            case 'simulation_summary':
                handleSimulationSummary(msg);
                break;

            case 'node_stats':
                // 如果模型中仍保留 printSummary()，它会通过 node_stats 发送 __SUMMARY__。
                // 将其作为 simulation_summary 的兼容来源。
                if (msg.nodeName === '__SUMMARY__' || msg.status === 'summary') {
                    handleSimulationSummary(msg);
                    break;
                }
                if (msg.nodeName) {
                    nodeStatsCache[msg.nodeName] = {
                        requiredPeople: msg.requiredPeople,
                        duration: msg.duration,
                        readyTime: msg.readyTime,
                        startTime: msg.startTime,
                        finishTime: msg.finishTime,
                        waitTime: msg.waitTime,
                        totalTime: msg.totalTime,
                        status: msg.status,
                        queuePosition: msg.queuePosition,
                        queueSize: msg.queueSize
                    };

                    if (isRecording && currentRunId) {
                        const node = currentData?.nodes?.find(n => n.name === msg.nodeName);
                        if (node) {
                            if (msg.status === 'ready') {
                                const config = getCachedNodeConfig(msg.nodeName);
                                const allProperties = extractConfigProperties(config);
                                recordNodeReadyWithProps(
                                    currentRunId, node.id, node.name || '', node.type || '',
                                    msg.requiredPeople || 0, node.isStartNode || false, node.isEndNode || false,
                                    node.description || '', 'ResourceTask', allProperties
                                );
                            } else if (msg.status === 'waiting') {
                                recordNodeWaiting(currentRunId, node.id, msg.queuePosition, msg.queueSize);
                            }
                        }
                    }

                    if (currentData) {
                        const selectedNode = currentData.nodes.find(n => n.id === selectedNodeId);
                        if (selectedNode && selectedNode.name === msg.nodeName) {
                            const nodeIsActive = msg.status === 'running';
                            showNodePanel(selectedNode, nodeIsActive);
                        }
                    }
                }
                break;

            case 'resource_pool_status':
                appendEventLog('资源池：总数=' + msg.total + '，可用=' + msg.available + '，等待队列=' + msg.waitingQueueSize, 'info', '');
                break;

            case 'resource_log':
                appendEventLog(msg.message || '', msg.level || 'info', msg.time);
                break;

            case 'node_config':
                if (msg.config && msg.taskName) {
                    putNodeConfig(msg.taskName, msg.config);
                    refreshSelectedNodeVariablesPanel();
                }
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            case 'node_config_updated':
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                } else {
                    const statusDiv = document.getElementById('fullConfigSubmitStatus');
                    if (statusDiv) {
                        if (msg.success) {
                            statusDiv.className = 'submit-status success';
                            statusDiv.textContent = '配置已保存到 MagicDraw';
                            showNotification('节点 "' + msg.taskName + '" 配置已更新');
                            nodeFullConfigCache.delete(msg.taskName);
                            nodeConfigCache.delete(msg.taskName);
                            allNodeConfigsLoaded = false;
                            setTimeout(() => {
                                if (msg.taskName) loadNodeFullConfig(msg.taskName);
                                updateAllIndicatorValues();
                            }, 500);
                        } else {
                            statusDiv.className = 'submit-status error';
                            statusDiv.textContent = '保存失败: ' + escapeHtml(msg.error || '未知错误');
                            showNotification('配置保存失败: ' + (msg.error || '未知错误'), true);
                        }
                    }
                }
                break;

            case 'node_full_config':
                if (msg.config && msg.taskName) {
                    putNodeConfig(msg.taskName, msg.config);
                    updateIndicatorValuesForNode(msg.taskName, msg.config);
                    refreshSelectedNodeVariablesPanel();
                }
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            case 'all_node_configs':
                if (msg.configs) {
                    cacheAllNodeConfigs(msg.configs);
                    allNodeConfigsLoaded = true;
                    refreshSelectedNodeVariablesPanel();
                }
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            case 'node_full_config_updated':
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                } else {
                    const statusDiv = document.getElementById('allPropsSubmitStatus');
                    if (statusDiv) {
                        if (msg.success) {
                            statusDiv.className = 'submit-status success';
                            statusDiv.textContent = msg.message || '所有属性已保存';
                            showNotification('节点 "' + msg.taskName + '" 所有属性已更新');
                            nodeFullConfigCache.delete(msg.taskName);
                            nodeConfigCache.delete(msg.taskName);
                            allNodeConfigsLoaded = false;
                            setTimeout(() => {
                                if (msg.taskName) loadNodeFullConfig(msg.taskName);
                                updateAllIndicatorValues();
                            }, 500);
                        } else {
                            statusDiv.className = 'submit-status error';
                            statusDiv.textContent = msg.message || '保存失败';
                            showNotification('属性保存失败: ' + (msg.message || '未知错误'), true);
                        }
                    }
                }
                break;

            // ★★★ 修改：node_subprocess_info - 获取到子流程信息后更新 behaviorName 并重绘 ★★★
            case 'node_subprocess_info':
                if (msg.nodeId) {
                    if (subprocessInfoCache.has(msg.nodeId) && subprocessInfoCache.get(msg.nodeId).loading) {
                        subprocessInfoCache.delete(msg.nodeId);
                    }
                    subprocessInfoCache.set(msg.nodeId, msg);

                    // ★★★ 更新节点的 behaviorName 并重绘 ★★★
                    const node = currentData?.nodes?.find(n => n.id === msg.nodeId);
                    if (node && msg.hasSubprocess && msg.subprocessName) {
                        node.behaviorName = msg.subprocessName;
                        // 重绘该节点
                        const oldG = zoomGroup?.querySelector(`[data-node-grp="${msg.nodeId}"]`);
                        if (oldG) {
                            oldG.remove();
                        }
                        if (!node.isSwimlane) {
                            if (isStateMachineDiagram) {
                                drawStateMachineNode(node);
                            } else {
                                drawNode(node);
                            }
                            if (msg.hasSubprocess) {
                                markNodeWithSubprocess(msg.nodeId, msg.subprocessName);
                            }
                        }
                    }

                    if (selectedNodeId === msg.nodeId) {
                        const node = currentData?.nodes?.find(n => n.id === msg.nodeId);
                        if (node) {
                            renderSubprocessInfoInPanel(node, msg);
                            if (msg.hasSubprocess && msg.hasDiagram) {
                                markNodeWithSubprocess(msg.nodeId, msg.subprocessName);
                            }
                        }
                    }
                }
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            // ★★★ 新增：节点约束信息 ★★★
            case 'node_constraints':
                renderNodeConstraints(msg.nodeId, msg.constraints || []);
                break;

            case 'subprocess_diagram_json':
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            case 'subprocess_diagram_opened':
                if (msg.success) {
                    appendEventLog('子流程图已打开: ' + msg.diagramName, 'info');
                    showNotification('已打开子流程图: ' + msg.diagramName);
                }
                if (msg._callbackId && window._configCallbacks && window._configCallbacks[msg._callbackId]) {
                    const callback = window._configCallbacks[msg._callbackId];
                    delete window._configCallbacks[msg._callbackId];
                    callback(msg);
                }
                break;

            case 'init_body_data':
                renderInitBodyEditor(msg.nodeId, msg.bodies || []);
                break;

            case 'init_body_updated':
                const statusDiv = document.getElementById('initBodyStatus');
                if (statusDiv) {
                    if (msg.success) {
                        statusDiv.className = 'submit-status success';
                        statusDiv.textContent = '已写回 MagicDraw';
                        showNotification('初始化 Body 已更新');
                    } else {
                        statusDiv.className = 'submit-status error';
                        statusDiv.textContent = msg.error || '未知错误';
                        showNotification('写回失败: ' + (msg.error || ''), true);
                    }
                }
                break;

            case 'debug_stereotype_info':
                appendEventLog(
                    '节点 "' + msg.taskName + '" 的 Stereotype 属性: hasStereotype=' + msg.hasStereotype + ', requiredPeople=' + msg.requiredPeople + ', duration=' + msg.duration,
                    'info'
                );
                showNotification('节点 "' + msg.taskName + '" requiredPeople=' + msg.requiredPeople);
                break;

            default:
                console.log('未处理的后端事件：', msg);
                break;
        }
    }

    // ========================= 运行变量 & 日志 =========================
    function updateRuntimeValues(values) {
        const tbody = document.getElementById('runtimeValuesBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        const entries = Object.entries(values || {});
        const countElement = document.getElementById('varCount');
        if (countElement) countElement.textContent = '(' + entries.length + '个变量)';
        if (entries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="color:#94a3b8;text-align:center;padding:10px;">暂无运行变量</td></tr>';
            return;
        }
        entries.forEach(([name, value]) => {
            const valueText = (value === null || value === undefined) ? '—' : String(value);
            const lower = valueText.toLowerCase();
            const cls = lower === 'true' ? 'true' : (lower === 'false' ? 'false' : '');
            const tr = document.createElement('tr');
            tr.innerHTML = '<td>' + escapeHtml(name) + '</td><td class="runtime-value ' + cls + '">' + escapeHtml(valueText) + '</td>';
            tbody.appendChild(tr);
        });
    }

    function appendEventLog(message, level, time) {
        const box = document.getElementById('eventLogBox');
        if (!box) return;
        if (box.children.length === 1 && box.children[0].textContent.includes('等待连接')) {
            box.innerHTML = '';
        }
        const div = document.createElement('div');
        div.className = 'log-line ' + (level || 'info');
        div.textContent = (time ? time + '  ' : '') + (message || '');
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        while (box.children.length > 1000) {
            box.removeChild(box.firstChild);
        }
    }

    // ========================= 记录控制 =========================
    function startRecording(msg) {
        if (isRecording) {
            appendEventLog('已有正在记录的仿真', 'warn');
            return;
        }

        isRecording = true;
        runStartTime = Date.now();
        sequenceCounter = 0;
        activeSchemeName = pendingSchemeName || getSchemeNameForStart();
        lastSimulationSummary = null;
        lastSummarySavedRunId = null;
        summarySavePromise = Promise.resolve();

        document.getElementById('dbStatus').className = 'db-status recording';
        document.getElementById('dbStatus').textContent = '记录中';

        const initVars = { ...(msg.initVars || {}) };
        initVars._schemeName = activeSchemeName;
        initVars._simulationTimeUnit = 'day';
        initVars._planSnapshotJson = JSON.stringify(buildCurrentPlanSnapshot());

        if (isDbOnline) {
            const runData = {
                diagramId: diagramId || '',
                diagramName: diagramName || '未命名流程',
                startMode: msg.mode || 'auto',
                contextName: msg.contextName || '',
                status: 'running',
                userId: 'system',
                remark: '仿真方案：' + activeSchemeName,
                initVarsMap: initVars
            };

            runRecordReadyPromise = axios.post(`${API_BASE_URL}/simulationRun/start`, runData)
                .then(async response => {
                    if (response.data.code === 200) {
                        currentRunId = response.data.data.id;
                        appendEventLog('开始记录方案“' + activeSchemeName + '”，运行ID: ' + currentRunId, 'info');

                        if (Object.keys(initVars).length > 0) {
                            try {
                                await axios.post(`${API_BASE_URL}/simulationRun/initVars/${currentRunId}`, initVars);
                                appendEventLog('已保存方案名称和 ' + Object.keys(initVars).length + ' 个初始化变量', 'info');
                            } catch (err) {
                                console.error('保存初始化变量失败:', err);
                            }
                        }

                        if (currentData && currentData.nodes) {
                            const actionNodes = currentData.nodes.filter(node =>
                                node.type === 'ActionImpl' || node.type === 'CallBehaviorActionImpl' ||
                                node.type === 'OpaqueActionImpl' || node.type === 'OpaqueAction'
                            );

                            for (const node of actionNodes) {
                                const taskName = node.name;
                                if (!taskName) continue;
                                let requiredPeople = 0;
                                const config = getCachedNodeConfig(taskName);
                                const allProperties = extractConfigProperties(config);
                                if (allProperties.requiredPeople !== undefined && allProperties.requiredPeople !== null && allProperties.requiredPeople !== '') {
                                    const peopleNumber = Number(allProperties.requiredPeople);
                                    if (Number.isFinite(peopleNumber)) requiredPeople = peopleNumber;
                                }
                                await recordNodeReadyWithProps(
                                    currentRunId, node.id, node.name || '', node.type || '',
                                    requiredPeople, node.isStartNode || false, node.isEndNode || false,
                                    node.description || '', 'ResourceTask', allProperties
                                );
                            }
                            appendEventLog('已保存 ' + actionNodes.length + ' 个节点的方案输入快照', 'info');
                        }
                        return currentRunId;
                    }

                    currentRunId = 'run_' + Date.now();
                    appendEventLog('创建运行记录失败: ' + response.data.msg + '，使用临时ID', 'warn');
                    return currentRunId;
                })
                .catch(error => {
                    currentRunId = 'run_' + Date.now();
                    appendEventLog('创建运行记录失败: ' + error.message + '，使用临时ID', 'warn');
                    return currentRunId;
                });
        } else {
            currentRunId = 'local_' + Date.now();
            runRecordReadyPromise = Promise.resolve(currentRunId);
            appendEventLog('数据库离线，使用本地记录ID: ' + currentRunId, 'warn');
        }
    }

    function stopRecording() {
        if (!isRecording) return;
        isRecording = false;
        document.getElementById('dbStatus').className = 'db-status online';
        document.getElementById('dbStatus').textContent = '数据库在线';

        if (currentRunId && isDbOnline) {
            const runId = currentRunId;
            const duration = runStartTime ? (Date.now() - runStartTime) : 0;

            axios.post(`${API_BASE_URL}/simulationRun/end`, null, { params: { id: runId } })
                .then(response => {
                    if (response.data.code === 200) {
                        appendEventLog('自动记录结束，运行ID: ' + runId + '，持续 ' + (duration / 1000).toFixed(1) + 's', 'info');
                        axios.get(`${API_BASE_URL}/simulationNode/stats/run/${runId}`)
                            .then(statsResp => {
                                if (statsResp.data.code === 200) {
                                    const stats = statsResp.data.data;
                                    appendEventLog('统计: 总节点=' + stats.totalNodes + ', 完成=' + stats.completedNodes + ', 运行中=' + stats.runningNodes + ', 错误=' + stats.errorNodes, 'info');
                                }
                            })
                            .catch(err => console.error('获取统计失败:', err));
                    }
                })
                .catch(error => console.error('结束运行记录失败:', error))
                .finally(() => {
                    currentRunId = null;
                    runStartTime = null;
                    pendingSchemeName = '';
                    activeSchemeName = '';
                    runRecordReadyPromise = Promise.resolve(null);
                });
        } else {
            currentRunId = null;
            runStartTime = null;
            pendingSchemeName = '';
            activeSchemeName = '';
            runRecordReadyPromise = Promise.resolve(null);
        }
    }

    function fitView() {
        const b = calculateBounds(),
            svgEl = document.getElementById('diagramSvg');
        const w = svgEl.clientWidth || 800,
            h = svgEl.clientHeight || 600;
        const sc = Math.min(w / b.width, h / b.height) * .88;
        const tx = (w - b.width * sc) / 2 - b.minX * sc;
        const ty = (h - b.height * sc) / 2 - b.minY * sc;
        d3.select('#diagramSvg').transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));
    }

    function toggleIndicatorPanel() {
