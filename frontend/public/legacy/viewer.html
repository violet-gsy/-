    function renderIndicatorTree(data, container, level, parentPath) {
        if (!container) return;
        if (level === undefined) level = 0;
        if (parentPath === undefined) parentPath = [];
        container.innerHTML = '';
        data.forEach(node => renderIndicatorNode(node, container, level, parentPath));
        updateIndicatorBadge();
    }

    function renderIndicatorNode(node, container, level, parentPath) {
        const hasChildren = node.children && node.children.length > 0;
        const isExpanded = expandedNodes.has(node.id);
        const isSelected = selectedIndicators.has(node.id);

        if (indicatorSearchKeyword) {
            const keyword = indicatorSearchKeyword.toLowerCase();
            const matchSelf = node.name.toLowerCase().includes(keyword);
            const matchChild = hasChildren && treeNodeHasMatch(node, keyword);
            if (!matchSelf && !matchChild) return;
        }

        const nodeEl = document.createElement('div');
        nodeEl.className = 'tree-node';
        nodeEl.dataset.id = node.id;

        const contentEl = document.createElement('div');
        contentEl.className = 'tree-node-content';
        if (indicatorSearchKeyword && node.name.toLowerCase().includes(indicatorSearchKeyword.toLowerCase())) {
            contentEl.classList.add('matched');
        }
        contentEl.style.paddingLeft = (12 + level * 16) + 'px';

        const toggleEl = document.createElement('span');
        toggleEl.className = 'tree-toggle' + (hasChildren ? '' : ' leaf') + (isExpanded ? '' : ' collapsed');
        toggleEl.innerHTML = '▼';
        toggleEl.onclick = (e) => {
            e.stopPropagation();
            if (!hasChildren) return;
            if (expandedNodes.has(node.id)) expandedNodes.delete(node.id);
            else expandedNodes.add(node.id);
            refreshIndicatorTree();
        };

        const checkboxEl = document.createElement('input');
        checkboxEl.type = 'checkbox';
        checkboxEl.className = 'tree-checkbox';
        checkboxEl.checked = isSelected;
        checkboxEl.indeterminate = getIndeterminateState(node);
        checkboxEl.onclick = (e) => {
            e.stopPropagation();
            toggleIndicatorNode(node, checkboxEl.checked);
        };

        const labelEl = document.createElement('span');
        labelEl.className = 'tree-label';
        labelEl.textContent = node.name;
        labelEl.title = node.name;
        labelEl.onclick = () => {
            if (hasChildren) {
                if (expandedNodes.has(node.id)) expandedNodes.delete(node.id);
                else expandedNodes.add(node.id);
                refreshIndicatorTree();
            }
        };

        const valueEl = document.createElement('span');
        valueEl.className = 'indicator-value';
        const indicatorData = indicatorValues.get(node.id);
        if (indicatorData && indicatorData.value !== undefined && indicatorData.value !== null) {
            const displayValue = typeof indicatorData.value === 'number' ?
                (Number.isInteger(indicatorData.value) ? indicatorData.value : indicatorData.value.toFixed(2)) :
                indicatorData.value;
            valueEl.textContent = displayValue;
            valueEl.classList.add('has-value');
            if (indicatorData.source) {
                valueEl.title = '来源: ' + indicatorData.source;
                valueEl.classList.add('bound');
            }
        } else if (indicatorData && indicatorData.loading) {
            valueEl.textContent = '⏳';
            valueEl.className = 'indicator-value waiting';
            valueEl.title = '正在加载...';
        } else if (indicatorData && indicatorData.error) {
            valueEl.textContent = '❌';
            valueEl.className = 'indicator-value unbound';
            valueEl.title = indicatorData.error;
        } else {
            if (indicatorBindings.has(node.id)) {
                valueEl.textContent = '⏳';
                valueEl.className = 'indicator-value waiting';
                valueEl.title = '已绑定到: ' + indicatorBindings.get(node.id) + '，等待值加载';
            } else {
                valueEl.textContent = '—';
                valueEl.className = 'indicator-value unbound';
            }
        }

        contentEl.appendChild(toggleEl);
        contentEl.appendChild(checkboxEl);
        contentEl.appendChild(labelEl);
        contentEl.appendChild(valueEl);
        nodeEl.appendChild(contentEl);

        if (hasChildren) {
            const childrenEl = document.createElement('div');
            childrenEl.className = 'tree-children' + (isExpanded ? '' : ' collapsed');
            node.children.forEach(child => renderIndicatorNode(child, childrenEl, level + 1, [...parentPath, node]));
            nodeEl.appendChild(childrenEl);
        }

        container.appendChild(nodeEl);
    }

    function treeNodeHasMatch(node, keyword) {
        if (node.name.toLowerCase().includes(keyword)) return true;
        if (node.children) {
            for (const child of node.children) {
                if (treeNodeHasMatch(child, keyword)) return true;
            }
        }
        return false;
    }

    function getIndeterminateState(node) {
        if (!node.children || node.children.length === 0) return false;
        const childIds = getAllDescendantIds(node);
        const selectedCount = childIds.filter(id => selectedIndicators.has(id)).length;
        if (selectedCount === 0) return false;
        if (selectedCount === childIds.length) return false;
        return true;
    }

    function getAllDescendantIds(node) {
        let ids = [];
        if (node.children) {
            node.children.forEach(child => {
                ids.push(child.id);
                ids = ids.concat(getAllDescendantIds(child));
            });
        }
        return ids;
    }

    function getAllDescendants(node) {
        let nodes = [];
        if (node.children) {
            node.children.forEach(child => {
                nodes.push(child);
                nodes = nodes.concat(getAllDescendants(child));
            });
        }
        return nodes;
    }

    function toggleIndicatorNode(node, checked) {
        if (checked) selectedIndicators.add(node.id);
        else selectedIndicators.delete(node.id);
        const descendants = getAllDescendants(node);
        descendants.forEach(d => {
            if (checked) selectedIndicators.add(d.id);
            else selectedIndicators.delete(d.id);
        });
        refreshIndicatorTree();
    }

    function refreshIndicatorTree() {
        const container = document.getElementById('indicatorTree');
        renderIndicatorTree(indicatorTreeData, container);
    }

    function searchIndicators(keyword) {
        indicatorSearchKeyword = keyword.trim();
        if (indicatorSearchKeyword) expandForSearch(indicatorTreeData, indicatorSearchKeyword.toLowerCase());
        refreshIndicatorTree();
    }

    function expandForSearch(nodes, keyword) {
        nodes.forEach(node => {
            if (node.children) {
                if (treeNodeHasMatch(node, keyword)) expandedNodes.add(node.id);
                expandForSearch(node.children, keyword);
            }
        });
    }

    function updateIndicatorBadge() {
        const header = document.querySelector('.indicator-header h3');
        if (!header) return;
        const count = selectedIndicators.size;
        let badge = header.querySelector('.indicator-badge');
        if (!badge) {
            badge = document.createElement('span');
            badge.className = 'indicator-badge';
            header.appendChild(badge);
        }
        badge.textContent = count;
        badge.style.display = count > 0 ? 'inline-block' : 'none';
    }

    function getSelectedIndicators() {
        const result = [];
        const collect = (nodes) => {
            nodes.forEach(node => {
                if (selectedIndicators.has(node.id)) result.push({ id: node.id, name: node.name });
                if (node.children) collect(node.children);
            });
        };
        collect(indicatorTreeData);
        return result;
    }

    function confirmIndicatorBind() {
        const selected = getSelectedIndicators();
        if (selected.length === 0) {
            showNotification('请至少选择一个指标', true);
            return;
        }

        let targetNode = null;
        if (selectedNodeId && currentData) {
            targetNode = currentData.nodes.find(n => n.id === selectedNodeId);
        }

        if (targetNode) {
            const nodeName = targetNode.name;
            if (!nodeName) {
                showNotification('当前选中的节点没有名称，无法绑定', true);
                return;
            }

            selected.forEach(indicator => {
                indicatorBindings.set(indicator.id, nodeName);
                appendEventLog('绑定指标 "' + indicator.name + '" 到节点 "' + nodeName + '"', 'info');
            });

            let config = null;
            if (nodeFullConfigCache.has(nodeName)) config = nodeFullConfigCache.get(nodeName);
            else if (nodeConfigCache.has(nodeName)) config = nodeConfigCache.get(nodeName);

            if (config) {
                updateIndicatorValuesForNode(nodeName, config);
                showNotification('已绑定 ' + selected.length + ' 个指标到节点 "' + nodeName + '"，并读取了配置值');
            } else {
                selected.forEach(indicator => {
                    indicatorValues.set(indicator.id, {
                        value: null,
                        source: nodeName,
                        timestamp: new Date().toISOString(),
                        loading: true
                    });
                });
                refreshIndicatorTree();
                appendEventLog('正在加载节点 "' + nodeName + '" 的配置...', 'info');
                showNotification('正在加载节点 "' + nodeName + '" 的配置...');
                loadNodeFullConfig(nodeName);
            }
        } else {
            appendEventLog('已选指标: ' + selected.map(s => s.name).join(', ') + '，请点击节点完成绑定', 'info');
            showNotification('已选择 ' + selected.length + ' 个指标（请点击节点完成绑定）');
        }
    }

    function clearIndicatorSelection() {
        selectedIndicators.clear();
        refreshIndicatorTree();
        showNotification('已清空指标选择');
    }

    function calculateIndicatorResults() {
        const results = [];
        const allIndicators = [];

        const collectIndicators = (nodes) => {
            nodes.forEach(node => {
                if (node.children && node.children.length > 0) collectIndicators(node.children);
                else allIndicators.push(node);
            });
        };
        collectIndicators(indicatorTreeData);

        allIndicators.forEach(indicator => {
            const valueData = indicatorValues.get(indicator.id);
            if (valueData && valueData.value !== undefined && valueData.value !== null) {
                const numValue = parseFloat(valueData.value);
                results.push({
                    id: indicator.id,
                    name: indicator.name,
                    value: !isNaN(numValue) ? numValue : valueData.value,
                    source: valueData.source || '未知',
                    timestamp: valueData.timestamp || new Date().toISOString(),
                    raw: valueData.value
                });
            } else if (valueData && valueData.loading) {
                const boundNode = indicatorBindings.get(indicator.id);
                results.push({
                    id: indicator.id,
                    name: indicator.name,
                    value: null,
                    source: boundNode || '加载中',
                    timestamp: new Date().toISOString(),
                    raw: null,
                    status: '加载中'
                });
            } else {
                const boundNode = indicatorBindings.get(indicator.id);
                results.push({
                    id: indicator.id,
                    name: indicator.name,
                    value: null,
                    source: boundNode || '未绑定',
                    timestamp: new Date().toISOString(),
                    raw: null,
                    status: boundNode ? '等待值' : '未绑定'
                });
            }
        });

        const panel = document.getElementById('indicatorResultPanel');
        const content = document.getElementById('indicatorResultContent');

        const numericResults = results.filter(r => typeof r.value === 'number' && !isNaN(r.value));
        const total = numericResults.reduce((sum, r) => sum + r.value, 0);
        const avg = numericResults.length > 0 ? total / numericResults.length : 0;
        const max = numericResults.length > 0 ? Math.max(...numericResults.map(r => r.value)) : 0;
        const min = numericResults.length > 0 ? Math.min(...numericResults.map(r => r.value)) : 0;

        let html = `
                    <div style="background:#f8fafc;padding:8px 12px;border-radius:4px;margin-bottom:10px;">
                        <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;">
                            <span>有效指标: <b>${numericResults.length}/${results.length}</b></span>
                            <span>总和: <b>${total.toFixed(2)}</b></span>
                            <span>平均值: <b>${avg.toFixed(2)}</b></span>
                            <span>最大值: <b>${max.toFixed(2)}</b></span>
                            <span>最小值: <b>${min.toFixed(2)}</b></span>
                        </div>
                    </div>
                    <div style="max-height:300px;overflow-y:auto;">`;

        results.forEach(r => {
            let valueDisplay = '—';
            let statusClass = '';
            if (r.value !== null && r.value !== undefined) {
                if (typeof r.value === 'number') valueDisplay = r.value.toFixed(2);
                else valueDisplay = String(r.value);
                statusClass = 'has-value';
            } else if (r.status === '加载中') {
                valueDisplay = '加载中';
                statusClass = 'waiting';
            } else if (r.status === '等待值') {
                valueDisplay = '等待值';
                statusClass = 'waiting';
            } else {
                valueDisplay = '未绑定';
                statusClass = 'unbound';
            }

            html += `
                        <div class="result-item">
                            <span class="name">${escapeHtml(r.name)}</span>
                            <span class="value ${statusClass}">${escapeHtml(valueDisplay)}</span>
                            <span class="source">${escapeHtml(r.source)}</span>
                        </div>`;
        });

        html += '</div>';
        content.innerHTML = html;
        panel.classList.add('show');
    }

    function closeIndicatorResult() {
        document.getElementById('indicatorResultPanel').classList.remove('show');
    }

    // ========================= 启动 =========================
    refreshIndicatorTree();
    loadJSON();
</script>
</body>
</html>
